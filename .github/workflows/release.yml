name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build resource pack
        run: python resourcepack/build_pack.py "${GITHUB_REF_NAME#v}"

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            aquatic-dist/target/AquaticSMP-*.jar \
            resourcepack/dist/AquaticSMP-ResourcePack.zip \
            --generate-notes \
            --verify-tag
