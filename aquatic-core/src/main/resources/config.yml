# AquaticSMP - main configuration
# Each module has its own file in plugins/AquaticSMP/modules/<module>.yml
# Toggle modules here, or in-game with /aquatic enable|disable <module>.
prefix: "<gradient:#1fa2ff:#12d8fa><bold>Aquatic</bold></gradient> <dark_gray>»</dark_gray> "
modules:
  economy: true
  crews: true
  bounty: true
  # Combat tag (no logging out mid-fight), respawn protection, new-player PvP protection.
  combat: true
  islands: true
  treasure: true
  items: true
  tournament: true
  events: true
  # Welcome intro for new players + the /guide book.
  guide: true
  # Stats sidebar on the right side of the screen (/sidebar to hide it).
  sidebar: true
  # The Harbor Market (/shop). Turn off if you use another shop plugin.
  shop: true
