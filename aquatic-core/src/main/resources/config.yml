# AquaticSMP - main configuration
# Each module has its own file in plugins/AquaticSMP/modules/<module>.yml
# Toggle modules here, or in-game with /aquatic enable|disable <module>.
prefix: "<gradient:#1fa2ff:#12d8fa><bold>Aquatic</bold></gradient> <dark_gray>»</dark_gray> "
modules:
  economy: true
  crews: true
  bounty: true
  # Combat tag (no logging out mid-fight), respawn protection, new-player PvP protection.
  combat: true
  # Pirate levels: XP from fights, treasure and exploring; small health/damage bonuses.
  levels: true
  islands: true
  treasure: true
  items: true
  # Abyss fruits (powers from eating a fruit). Off = no fruit powers; the other custom items keep working.
  fruits: true
  tournament: true
  events: true
  # Welcome intro for new players + the /guide book.
  guide: true
  # Stats sidebar on the right side of the screen (/sidebar to hide it).
  sidebar: true
  # The Harbor Market (opened at the shopkeepers at spawn). Turn off if you use another shop plugin.
  shop: true
  # The spawn town hub: shopkeeper villagers, crew registrar, bounty board, founders' monument, parkour.
  hub: true
  # The smithy: upgrade weapons, armour, tools and bows (+1 .. +5) with /smithy or at the Blacksmith.
  smithy: true
  # Village quests: villagers on neutral village islands give quests (fish, hunt, bring materials).
  quests: true
