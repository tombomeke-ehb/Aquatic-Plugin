# =====================================================================================
#  AquaticSMP - Pirate levels
#  Earn XP by fighting, hunting treasure and exploring. Levels make you a little stronger.
# =====================================================================================
max-level: 50
# XP needed for each level: base * level ^ exponent (level 2 = 100, level 10 ~ 2400, level 30 ~ 13900).
curve:
  base: 100
  exponent: 1.45
# Action bar "+XP" messages.
show-xp-gains: true
# Broadcast every N levels.
announce-every: 10

perks:
  # +0.5% melee damage per level (level 50 = +24.5%), capped at max-damage.
  damage-per-level: 0.005
  max-damage: 0.25
  # One extra heart every 5 levels (level 50 = +10 hearts), capped at max-health (half-hearts).
  heart-every: 5
  max-health: 20

xp:
  pvp-kill: 60
  # The same player only counts once per this many minutes (no farming).
  pvp-cooldown-minutes: 10
  discover-island: 30
  bounty-per-doubloon: 0.05
  treasure:
    common: 25
    uncommon: 40
    rare: 70
    epic: 120
    legendary: 250
    mega: 600
    default: 40
  # Monsters from spawners give only a part of the XP.
  spawner-multiplier: 0.2
  mobs:
    default: 6
    zombie: 6
    skeleton: 7
    creeper: 8
    spider: 6
    drowned: 10
    guardian: 15
    elder_guardian: 200
    witch: 15
    pillager: 12
    ravager: 60
    warden: 500
    ender_dragon: 1500
    wither: 1000

# Rewards for reaching a level, handed out once (players who were already past a level get it on
# their next login). Per level: doubloons, items ("item:<custom id>:<amount>" or "MATERIAL:<amount>"),
# commands (run by the console, {player} = name) and a title (shown in /level and on the sidebar).
rewards:
  enabled: true
  levels:
    5: {doubloons: 500, items: ["GOLDEN_APPLE:2", "item:rum:2"], title: "<gray>Deckhand"}
    10: {doubloons: 1500, items: ["DIAMOND:2", "item:healing_tonic:1"], title: "<white>Sailor"}
    15: {doubloons: 2500, items: ["DIAMOND:4", "EXPERIENCE_BOTTLE:16"], title: "<aqua>Bosun"}
    20: {doubloons: 4000, items: ["item:tide_compass:1", "ENDER_PEARL:8"], title: "<green>Navigator"}
    25: {doubloons: 6000, items: ["item:corsair_hat:1", "GOLDEN_APPLE:4"], title: "<yellow>Corsair"}
    30: {doubloons: 9000, items: ["NETHERITE_SCRAP:2", "item:gale_grog:2"], title: "<gold>Sea Wolf"}
    35: {doubloons: 12000, items: ["NETHERITE_SCRAP:3", "ENCHANTED_GOLDEN_APPLE:1"], title: "<red>Reaver"}
    40: {doubloons: 16000, items: ["item:tide_rapier:1", "NETHERITE_INGOT:1"], title: "<light_purple>Stormcaller"}
    45: {doubloons: 22000, items: ["NETHERITE_INGOT:2", "ENCHANTED_GOLDEN_APPLE:2"], title: "<dark_purple>Dread Corsair"}
    50: {doubloons: 35000, items: ["item:captains_coat:1", "NETHERITE_INGOT:3"], title: "<gradient:#ffcc00:#ff6a00><bold>Legend of the Sea</bold></gradient>"}

messages:
  reward: "<gold>Level <level> reward: <white><rewards>"
  reward-title: "<gold>New title: <title>"
  info-title: "<gray>Title: <title>"
  rewards-header: "<gold><bold>Level rewards"
  rewards-line-got: "<green>✔ <white>Level <level></white> <gray>- <rewards> <title>"
  rewards-line-open: "<dark_gray>✘ <gray>Level <level> - <rewards> <title>"
  xp-gain: "<aqua>+<amount> XP <dark_gray><reason>"
  reason-pvp: "(pirate defeated)"
  reason-treasure: "(treasure)"
  reason-discover: "(island discovered)"
  reason-bounty: "(bounty claimed)"
  levelup-title: "<gold><bold>LEVEL <level>"
  levelup-subtitle: "<yellow>You grow stronger, pirate"
  levelup: "<gold>Level <white><level></white>! <gray>Bonus now: <white>+<damage>%</white> damage, <white>+<hearts></white> hearts."
  levelup-broadcast: "<gold><white><player></white> reached pirate level <white><level></white>!"
  info: "<aqua><player></aqua> <gray>- pirate level <white><level></white>/<max>"
  info-next: " <gray>XP: <white><xp></white> <dark_gray>(<next> to the next level)"
  info-max: " <gray>XP: <white><xp></white> <gold>(max level)"
  info-perks: " <gray>Bonus: <white>+<damage>%</white> damage, <white>+<hearts></white> hearts"
  top-header: "<gold>Highest-level pirates:"
  top-entry: " <gray>#<rank> <white><player></white> <dark_gray>-</dark_gray> <aqua>level <level>"
  admin-given: "<green>Gave <white><amount></white> XP to <white><player></white>."
  admin-set: "<green><white><player></white> is now level <white><level></white>."
