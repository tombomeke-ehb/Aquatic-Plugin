# =====================================================================
#  AquaticSMP - Crews module
#  Pirate crews: ranks, diplomacy, wars, reputation, crew chat, bank and home.
#  Reload with: /aquatic reload crews
#  Crews are stored in plugins/AquaticSMP/data/crews/crews.yml
# =====================================================================

# Do not edit: used to upgrade this file when the plugin updates.
config-version: 3

# Maximum number of pirates in one crew (captain included).
max-members: 6

# How often (seconds) changes are written to disk. Always saved on shutdown/reload.
autosave-seconds: 120

# Seconds before a /crew invite expires.
invite-expire-seconds: 120

# Entries per page of /crew list and /crew top.
list-page-size: 10

# Announce new crews and disbanded crews to the whole server.
announce-creation: true
announce-disband: true

# Crew names: length, allowed characters (a Java regular expression) and forbidden words.
# Names and tags are unique (case-insensitive), and a name may not equal another crew's tag.
name:
  min-length: 3
  max-length: 16
  allowed-characters: "[A-Za-z0-9_]+"
  blocked-words:
    - admin
    - staff
    - tidewatch

# Crew tags (shown in chat and the tab list). Tags are stored in upper case.
# When /crew create is used without a tag, one is made from the first letters of the name.
tag:
  min-length: 2
  max-length: 4
  allowed-characters: "[A-Za-z0-9]+"

# Colour new crews get. A colour name (aqua, gold, red, ...) or a hex code (#1fa2ff).
default-color: aqua
# May crews pick any hex colour with /crew color, or only the 16 named colours?
allow-hex-colors: true
# Colours nobody may pick (e.g. reserved for staff).
blocked-colors:
  - dark_red

# Doubloons charged from the player's purse. Ignored when the economy module is disabled.
costs:
  create: 1000
  color: 250
  tag: 250
  sethome: 0
  # Changing the flag design (/crew flag set|color|preset) and taking a copy (/crew flag get).
  flag: 0
  flag-copy: 0

# -------------------------------------------------------------------------------------
# Crew flags
# The flag is planted on every island the crew claims (and is what enemies capture in a conquest).
#   /crew flag set            use the banner in your hand (design any banner in a loom!)
#   /crew flag color <dye>    change the base colour, keep the design
#   /crew flag preset <name>  use one of the designs below
#   /crew flag get / reset    a copy for yourself / back to the default flag
# A preset: base colour + layers "pattern:colour". "crew" = the dye closest to the crew colour.
# Patterns: skull, cross, straight_cross, border, curly_border, flower, creeper, globe, piglin, flow,
#   guster, mojang, bricks, circle, rhombus, gradient, gradient_up, half_horizontal, half_vertical,
#   stripe_top, stripe_bottom, stripe_left, stripe_right, stripe_center, stripe_middle, small_stripes,
#   stripe_downleft, stripe_downright, triangle_top, triangle_bottom, triangles_top, triangles_bottom,
#   diagonal_left, diagonal_right, square_top_left, square_top_right, square_bottom_left, square_bottom_right
# Colours: white, orange, magenta, light_blue, yellow, lime, pink, gray, light_gray, cyan, purple,
#   blue, brown, green, red, black (or crew)
# -------------------------------------------------------------------------------------
flag:
  # Flag a crew flies until it designs its own (follows the crew colour).
  default-preset: crew_colors
  presets:
    crew_colors:
      base: crew
      patterns: ["skull:white", "border:black"]
    jolly_roger:
      base: black
      patterns: ["skull:white"]
    crossbones:
      base: black
      patterns: ["cross:white", "skull:white", "border:black"]
    blood_skull:
      base: red
      patterns: ["skull:black", "curly_border:black"]
    sea_kraken:
      base: crew
      patterns: ["flow:white", "border:black"]
    sun_pirates:
      base: orange
      patterns: ["circle:yellow", "flower:red", "border:black"]
    navy:
      base: white
      patterns: ["stripe_top:blue", "stripe_bottom:blue", "globe:light_blue"]

# Small icon per rank, used as <rank_icon> in chat and the tab list ("" = no icon).
rank-icons:
  CAPTAIN: "<gold>★</gold>"
  FIRST_MATE: "<yellow>☆</yellow>"
  NAVIGATOR: "<aqua>⚓</aqua>"
  QUARTERMASTER: "<green>⚖</green>"
  MEMBER: "<gray>•</gray>"

# Names shown for every rank.
rank-names:
  CAPTAIN: "Captain"
  FIRST_MATE: "First Mate"
  NAVIGATOR: "Navigator"
  QUARTERMASTER: "Quartermaster"
  MEMBER: "Deckhand"

# How many members may hold a rank at once (-1 = unlimited). There is always exactly one Captain.
rank-limits:
  FIRST_MATE: 1
  NAVIGATOR: 1
  QUARTERMASTER: 1

# Which ranks may do what. The Captain may always do everything.
# Ranks: FIRST_MATE, NAVIGATOR, QUARTERMASTER, MEMBER
# Nobody can kick or re-rank someone of equal or higher rank, except the Captain.
permissions:
  invite: [FIRST_MATE, NAVIGATOR, QUARTERMASTER]
  kick: [FIRST_MATE]
  setrank: [FIRST_MATE]
  # /crew color, /crew tag and /crew flag
  appearance: [FIRST_MATE]
  sethome: [FIRST_MATE, NAVIGATOR]
  friendlyfire: [FIRST_MATE]
  bank-withdraw: [FIRST_MATE, QUARTERMASTER]
  # /crew ally, /crew neutral, /crew rival
  diplomacy: [FIRST_MATE]
  # /crew war and /crew peace
  war: [FIRST_MATE]

friendly-fire:
  # Friendly fire state of new crews (false = crewmates cannot hurt each other).
  default: false
  # May crews switch friendly fire on with /crew friendlyfire?
  allow-toggle: true
  # Also protect allied crews from each other (melee, arrows, tridents, TNT, harmful potions, pets).
  protect-allies: true

# Reputation = fame on the seas, used by /crew top.
reputation:
  # Reputation new crews start with.
  starting: 0
  # May reputation drop below 0?
  allow-negative: false
  # Gained by the killer's crew for killing a member of another (non-allied) crew.
  kill: 10
  # Gained for killing a member of a crew you are at war with.
  war-kill: 25
  # Gained for killing a player without a crew.
  kill-crewless: 2
  # Lost by the victim's crew when one of its members is killed by another player.
  death: 5
  # Lost when killed by a crew you are at war with.
  war-death: 10
  # The same killer/victim pair only counts once per this many seconds (stops alt farming).
  repeat-kill-cooldown-seconds: 300

bank:
  # Maximum Doubloons a crew bank can hold.
  max-balance: 1000000000
  # Give the bank contents to the captain when the crew is disbanded (otherwise it is lost).
  refund-on-disband: true

diplomacy:
  # Seconds before an unanswered alliance or peace offer expires.
  request-expire-seconds: 300
  # Maximum alliances per crew (-1 = unlimited).
  max-allies: 3

war:
  enabled: true
  # Announce war declarations and peace to the whole server (otherwise only the two crews).
  announce: true
  # Doubloons taken from the declaring crew's BANK to declare war (0 = free).
  cost: 500
  # Minimum minutes a war lasts before peace can be made (both crews must agree to peace).
  min-duration-minutes: 60
  # Maximum wars a crew can fight at once (-1 = unlimited).
  max-active-wars: 2
  # Both crews need at least this many members.
  min-members: 1
  # Only crews you declared rivals first can be attacked.
  require-rival: false

home:
  enabled: true
  # Seconds to stand still before teleporting. Moving or taking damage cancels it.
  warmup-seconds: 5
  # Seconds between two uses of /crew home (bypass: aquatic.crews.home.bypass-cooldown).
  cooldown-seconds: 300
  # Worlds where no crew home may be set.
  blocked-worlds:
    - world_the_end

chat:
  # Our own join and leave messages. Off by default: Essentials (or another plugin) keeps handling them.
  # Turn on to use these instead ("" = no message). Tags: <rank> (LuckPerms prefix), <group> (LuckPerms rank),
  # <player> (LuckPerms display name or nickname), <suffix>, <level>, <crew>, <tag>, <online>, and PlaceholderAPI.
  join-messages: false
  join-message: "<dark_gray>[<green>+<dark_gray>] <rank><white><player><suffix> <gray>came aboard."
  first-join-message: "<gold>⚓ <white><player></white> <gold>joins the crew of the sea for the first time! <gray>(<online> online)"
  quit-message: "<dark_gray>[<red>-<dark_gray>] <rank><white><player><suffix> <gray>went ashore."
  # Put the crew tag in front of public chat messages.
  prefix-enabled: true
  # Tags: <tag> (crew tag in crew colour), <crew> (crew name), <rank_icon> (see rank-icons)
  prefix-format: "<rank_icon> <dark_gray>[<tag><dark_gray>] "
  # Prefix for players without a crew (empty = none), e.g. "<dark_gray>[<gray>Drifter<dark_gray>] "
  no-crew-prefix: ""
  # Hover over a name or crew tag in chat for a card with crew, rank, reputation and bounty.
  # Clicking the tag opens /crew info, clicking the name starts a /msg.
  hover-cards: true
  # The whole chat line. Turn "enabled" off when another chat plugin (EssentialsX Chat, ...) formats chat;
  # the crew prefix is then put in front of that plugin's line.
  # Tags: <rank> (rank prefix from LuckPerms/Vault), <level> (level badge), <prefix> (crown + crew tag),
  #       <name> (hover card), <suffix> (suffix from LuckPerms/Vault, e.g. a logo), <message>
  format:
    enabled: true
    line: "<rank><level><prefix><white><name><suffix><dark_gray> » <gray><message>"
    level-badge: "<dark_gray>[<aqua><level><dark_gray>] "
  # Mentioning an online player (with or without @) highlights the name and plays a ping for them.
  mentions:
    enabled: true
    highlight: "<yellow>@<name></yellow>"
    sound: entity.experience_orb.pickup
  # Typing this in a message shows the item in your hand (hover it for the details). "" = off.
  item-tag: "[item]"
  # Extra prefix for the reigning Conqueror of the Sea (needs the tournament module). Empty = none.
  conqueror-prefix: "<gold>👑 </gold>"
  # Crew chat (/cc <message> or /crew chat toggle). Tags: <crew> <tag> <rank> <player> <message>
  crew-format: "<dark_aqua>[<tag><dark_aqua>] <gray><rank> <white><player><dark_gray>: <aqua><message>"
  # Also print crew chat in the console.
  log-crew-chat: true

tablist:
  # Show the crew tag in front of names in the tab list.
  enabled: true
  # Tags: <rank> (rank prefix from LuckPerms/Vault) <group> (LuckPerms rank) <level> <tag> <crew> <player> <rank_icon> <suffix>
  # PlaceholderAPI placeholders work in every tab and chat line too, e.g. %luckperms_prefix%,
  # %luckperms_meta_displayname%, %player_ping%. Legacy colours they return (&c, &#ff8800) are kept.
  format: "<rank><level><rank_icon> <dark_gray>[<tag><dark_gray>] <white><player><suffix>"
  # Players without a crew ("" = the plain name).
  no-crew-format: "<rank><level><white><player><suffix>"
  level-badge: "<dark_gray>[<aqua><level><dark_gray>] "
  # Header and footer of the tab list (turn off when you use the TAB plugin).
  # Tags: <player> <online> <max> <crew> <balance> <bounty>
  header-footer: true
  header:
    - ""
    - "<gradient:#1fa2ff:#12d8fa><bold>AQUATIC SMP</bold></gradient>"
    - "<gray>Sail. Claim. Conquer."
    - ""
  footer:
    - ""
    - "<gray>Online: <white><online></white>/<white><max></white> <dark_gray>|</dark_gray> <gray>Crew: <crew>"
    - "<gray>Doubloons: <yellow><balance></yellow> <dark_gray>|</dark_gray> <gray>Bounty: <red><bounty>"
    - "<dark_gray>/guide for help"
    - ""

placeholderapi:
  # Register %aquatic_...% placeholders when PlaceholderAPI is installed.
  # %aquatic_crew% %aquatic_crew_tag% %aquatic_crew_tag_colored% %aquatic_crew_rank% %aquatic_crew_reputation%
  # %aquatic_crew_members% %aquatic_balance% %aquatic_balance_formatted% %aquatic_bounty% %aquatic_bounty_formatted%
  enabled: true
  # Text shown by crew placeholders for players without a crew.
  no-crew: ""

# ---------------------------------------------------------------------
#  Messages (MiniMessage format). <placeholders> are filled in by the plugin.
# ---------------------------------------------------------------------
# -------------------------------------------------------------------------------------
# Crew teleports: /tpa <crewmate>, /tpahere <crewmate>, /tpaccept, /tpdeny
# Only between crewmates (and allies when allow-allies is true). Blocked in combat.
# take-over: these names belong to AquaticSMP even when EssentialsX has them too.
# blocked-commands: other plugins' teleport-request commands, blocked for everyone but admins.
# -------------------------------------------------------------------------------------
teleport:
  enabled: true
  allow-allies: false
  warmup-seconds: 3
  cooldown-seconds: 60
  expire-seconds: 60
  take-over: true
  blocked-commands:
    - essentials:tpa
    - essentials:tpahere
    - essentials:tpaccept
    - essentials:tpdeny
    - essentials:tpaall
    - essentials:call
    - etpa
    - call
    - ecall
    - tpask
    - etpask
    - etpahere
    - tpaall
    - etpaall
    - etpyes
    - etpaccept
    - etpno
    - etpdeny

