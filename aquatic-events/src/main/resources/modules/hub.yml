# =====================================================================================
#  AquaticSMP - Harbour hub (the spawn town on the capital)
#  Shopkeepers in the market stalls, the crew registrar, the bounty board, the founders'
#  monument, a welcome sign and the parkour tower timer.
#
#  Positions are offsets [x, z] from the capital's centre and match the generated town.
#  Built your own spawn? Stand somewhere and use /hubadmin place <id> to move an NPC or sign
#  there (/hubadmin reset <id> puts it back, /hubadmin list shows them all).
#  NPCs and signs are not saved in the world: they appear while players are nearby.
#
#  NPCs with "island-type: VILLAGE" stand on every village island instead (offsets from the well).
#
#  NPC actions (run when a player right-clicks it):
#    "shop:<category>"  open the market (players have no /shop: the shopkeepers are the way in)
#    "gamble"           open the gambling den (dice, wheel, coin flips)
#    "cmd:<command>"  the player runs the command (without /)
#    "msg:<text>"     a MiniMessage line (clickable with <click:run_command:'/...'>)
# =====================================================================================
config-version: 9

npcs:
  blacksmith:
    name: "<gold><bold>Blacksmith</bold> <gray>(smithy & tools)"
    profession: weaponsmith
    offset: [17, 7]
    actions: ["cmd:smithy"]
  provisioner:
    name: "<green><bold>Provisioner</bold> <gray>(food & drinks)"
    profession: farmer
    offset: [7, 17]
    actions: ["shop:food"]
  shipwright:
    name: "<aqua><bold>Shipwright</bold> <gray>(sailing)"
    profession: fisherman
    offset: [-7, 17]
    actions: ["shop:sailing"]
  merchant:
    name: "<yellow><bold>Merchant</bold> <gray>(sell your loot)"
    profession: cartographer
    offset: [-17, 7]
    actions: ["shop:trade"]
  carpenter:
    name: "<#c8a165><bold>Carpenter</bold> <gray>(wood & decor)"
    profession: fletcher
    offset: [-17, -7]
    actions: ["shop:decor"]
  quartermaster:
    name: "<red><bold>Quartermaster</bold> <gray>(pirate gear)"
    profession: armorer
    offset: [-7, -17]
    actions: ["shop:pirate"]
  registrar:
    name: "<blue><bold>Crew Registrar"
    profession: librarian
    offset: [7, -17]
    actions:
      - "msg:<aqua>Ahoy! Every pirate needs a crew. Founding one costs <yellow>1,000 Doubloons</yellow>."
      - "msg:<click:suggest_command:'/crew create '><hover:show_text:'<gray>Click, then type a name'><green><bold>[Found a crew]</bold></hover></click>  <click:run_command:'/crew list'><hover:show_text:'<gray>All crews'><yellow><bold>[Browse crews]</bold></hover></click>  <click:run_command:'/crew info'><hover:show_text:'<gray>Your crew'><aqua><bold>[My crew]</bold></hover></click>"
  stonemason:
    name: "<gray><bold>Stonemason</bold> <gray>(building blocks)"
    profession: mason
    offset: [17, -7]
    actions: ["shop:masonry"]
  # The gambling den's dealer (dice, wheel of fortune, coin flips: gambling.yml). Move him into your own
  # den build with /hubadmin place dealer.
  dealer:
    name: "<gold><bold>Dealer</bold> <gray>(gambling den)"
    profession: nitwit
    # Behind the counter of the gambling den the capital builds on its plaza.
    offset: [6, 32]
    actions: ["gamble"]
  # ---- the village folk: they stand around the well of every village and give quests (quests.yml)
  village_elder:
    island-type: VILLAGE
    name: "<gold><bold>Village Elder</bold> <gray>(quests)"
    profession: cleric
    offset: [3, 3]
    actions: ["cmd:quests talk elder"]
  village_fisher:
    island-type: VILLAGE
    name: "<aqua><bold>Old Fisher</bold> <gray>(quests)"
    profession: fisherman
    offset: [-3, 3]
    actions: ["cmd:quests talk fisher"]
  village_smith:
    island-type: VILLAGE
    name: "<#e67e22><bold>Village Smith</bold> <gray>(quests)"
    profession: weaponsmith
    offset: [3, -3]
    actions: ["cmd:quests talk smith"]
  village_hunter:
    island-type: VILLAGE
    name: "<red><bold>Hunter</bold> <gray>(quests)"
    profession: butcher
    offset: [-3, -3]
    actions: ["cmd:quests talk hunter"]

# Floating signs. type: text (fixed lines), bounties (most wanted) or parkour (best times).
# height = blocks above the ground at that spot.
displays:
  welcome:
    offset: [0, 16]
    height: 3.0
    type: text
    text:
      - "<gradient:#1fa2ff:#12d8fa><bold>AQUATIC SMP</bold></gradient>"
      - "<white>Sail. Claim. Conquer."
      - "<gray>Shops in the stalls · <white>/guide</white> for help"
  # Right under the welcome sign.
  discord:
    offset: [0, 16]
    height: 2.2
    type: text
    text:
      - "<#5865f2><bold>Join our Discord!</bold>"
      - "<white>Type <#8ea1ff>/discord</#8ea1ff> for the invite"
  bounty-board:
    offset: [-26, 0]
    height: 2.6
    type: bounties
    lines: 5
    header: ["<red><bold>☠ WANTED ☠</bold>", "<gray>Dead or alive"]
    line: "<white><rank>. <yellow><player></yellow> <dark_gray>-</dark_gray> <red><bounty>"
    empty: "<gray>No bounties yet. Be the first!"
  # Above the founders' shrine, in front of the obelisk.
  founders:
    offset: [28, 0]
    height: 4.6
    type: text
    text:
      - "<gold><bold>Founders of Aquatic SMP</bold>"
      - "<white>Owner & idea: <aqua>MegaAquatic"
      - "<white>Developed by <aqua>tombomeke</aqua> & <aqua>Moekun"
      - "<gray>Thank you to everyone who helped build this sea!"
  # At the foot of the shrine's steps: where the legendary weapons come from.
  relics:
    offset: [22, 0]
    height: 2.6
    type: text
    text:
      - "<gradient:#f6d365:#fda085><bold>⚔ Legendary Relics ⚔</bold></gradient>"
      - "<white>Raid <aqua>Tidewatch forts</aqua>, dig up <yellow>buried treasure</yellow>"
      - "<white>and crack open <gold>crates</gold> to find legendary weapons."
      - "<gray>The rarest ones only drop from MEGA legendary treasure."
  parkour:
    offset: [0, -25]
    height: 2.2
    type: parkour
    lines: 3
    header: ["<green><bold>Parkour Tower</bold>", "<gray>Step on the gold plate to start"]
    line: "<white><rank>. <yellow><player></yellow> <gray><time>"
    empty: "<gray>No times yet!"


# The founders' shrine on the capital: a player head on every pedestal with a name and role above it.
# player = the Minecraft username whose skin the head shows (looked up once when the head appears).
# The offsets match the generated shrine (the owner in the middle). Built your own shrine? Stand on top of
# a pedestal, look the way the head should face and use /hubadmin place founder:<id>.
founders:
  enabled: true
  moekun:
    player: Moekun          # TODO: the real username of Moekun
    name: "<#ff9ff3><bold>Moekun"
    role: "<gray>Developer"
    offset: [27, -6]
  tombomeke:
    player: tombomekeMS
    name: "<#7ed6df><bold>Tombomeke"
    role: "<gray>Main Developer"
    offset: [27, -3]
  megaaquatic:
    player: MegaAquatic
    name: "<gradient:#1fa2ff:#12d8fa><bold>MegaAquatic</bold></gradient>"
    role: "<gold>The Owner"
    offset: [27, 0]
  devvv:
    player: devv_
    name: "<#badc58><bold>Devv_"
    role: "<gray>Developer"
    offset: [27, 3]
  crimson:
    player: crimsonEvaz
    name: "<#eb4d4b><bold>Crimson"
    role: "<gray>Developer/Builder"
    offset: [27, 6]

parkour:
  enabled: true
  # Doubloons for finishing, at most once per reward-cooldown-hours per player.
  reward: 250
  reward-cooldown-hours: 20
  # A run is cancelled after this long, when you leave the capital or when you teleport.
  max-seconds: 600
  # Faster than this is not a real run.
  min-seconds: 6

messages:
  parkour-start: "<green>Parkour started! <gray>Reach the iron plate on top."
  parkour-timer: "<green>Parkour <white><time>"
  parkour-cancelled: "<red>Parkour run cancelled."
  parkour-no-record: "<yellow>Finished, but that run doesn't count (flying, creative or too fast)."
  parkour-finish: "<green>Finished in <white><time></white>! <gray>(best <white><best></white>)"
  parkour-finish-best: "<gold><bold>New best!</bold> <green>Finished in <white><time></white>."
  parkour-reward: "<gold>+<amount> <gray>for finishing the parkour."
  parkour-best: "<aqua>Your best parkour time: <white><time>"
  parkour-top-line: "<gray><rank>. <white><player></white> <dark_gray>-</dark_gray> <yellow><time>"
  admin-capital: "<aqua>Capital: <white><capital>"
  admin-line: "<gray>- <white><id></white> <dark_gray>(<where>, spawned: <alive>)"
  admin-placed: "<green>Moved <white><id></white> to where you stand."
  admin-reset: "<green><white><id></white> is back at its default spot."
  admin-refreshed: "<green>All hub NPCs and signs respawn now."
  admin-unknown: "<red>Unknown NPC or sign: <white><id>"
