  setup-found: "<green>The capital's crates are ready (<white><count></white> new)."
  got-block: "<green>Place this block anywhere to make a <crate><green> there."
  placed: "<green>The <crate><green> is ready."
  place-no-permission: "<red>Only staff can place crates."
