# =====================================================================================
#  AquaticSMP - Items module (modules/items.yml)
# =====================================================================================
#  Custom pirate items: Abyss Fruits, Abyssal Iron, legendary swords (Meito), guns,
#  cannons, the Tide Compass, Echo Conch, rum and the Sea Sovereign's crown.
#
#  Commands
#    /aitem give <player> <id> [amount]       (aquatic.items.admin)
#    /aitem list                              (aquatic.items.admin)
#    /aitem fruit set <player> <fruit|none>   (aquatic.items.admin)
#    /aitem fruit info [player]               (aquatic.items.admin)
#    /fruit                                   (aquatic.items.fruit, everyone by default)
#
#  Other modules (treasure loot tables, events, the tournament) reference items by their id
#  below, e.g. "item:gomu_gomu" in a reward list.
#
#  Reload with /aquatic reload items
# =====================================================================================

# -------------------------------------------------------------------------------------
#  Abyss fruit rules
# -------------------------------------------------------------------------------------
# Extra ability effects (shockwaves, beams, auras, trails). quality multiplies the particle amounts:
# 0 = off (only the basic particles), 0.5 = light (big servers), 1 = normal, 1.5 = rich.
# Every ability can also get its own colour with  color: "#ff6a00"  in its section.
effects:
  quality: 1.0

fruits:
  # Only one abyss fruit power per player.
  one-per-player: true
  # What happens when someone who already has a power eats a second fruit:
  #   refuse = the fruit cannot be eaten (it stays in the hand)
  #   lethal = the body cannot take two powers: the player dies (the fruit is consumed)
  second-fruit: refuse
  # When true each fruit power can only be owned by one player at a time.
  unique-fruits: false
  # Broadcast to the whole server when someone eats a fruit.
  announce: true
  # Lose the power on death.
  lose-on-death: false
  # When the power is lost on death, the fruit "reincarnates": it drops where the player died.
  reincarnate-drop: true
  # How to trigger the active ability of your fruit. Any of:
  #   sneak-right-click  (sneak + right-click with an EMPTY main hand; the Minecraft client only
  #                       reports this while looking at a block, so keep a swap-hands trigger too)
  #   sneak-left-click   (sneak + left-click with an EMPTY main hand)
  #   swap-hands         (the swap-hands key, default F; replaces swapping for fruit users!)
  #   sneak-swap-hands   (sneak + swap-hands key)
  triggers:
    - sneak-right-click
    - sneak-swap-hands
  # Show the cooldown of your ability on the action bar.
  show-cooldown-bar: true
  # How often (in ticks, 20 = 1 second) passive effects and sea weakness are refreshed.
  passive-interval-ticks: 20
  # The sea rejects abyss fruit users.
  sea-weakness:
    enabled: true
    # Also counts standing in the rain.
    rain: false
    # Effects while in water. Format: effect:level  (minecraft effect names)
    effects:
      - slowness:3
      - weakness:2
      - mining_fatigue:2
    # Prevent swimming and pull the player down (they sink like a hammer). Boats are safe.
    sink: true
    # Downwards speed in blocks/tick while sinking.
    sink-speed: 0.12
    # Fruit passives (and immunities) stop working in water.
    disable-passives: true
    # Fruit abilities cannot be used in water.
    disable-abilities: true

# -------------------------------------------------------------------------------------
#  Item definitions
# -------------------------------------------------------------------------------------
#  Every item has:
#    type:              fruit | sword | seastone | gun | cannon | logpose | denden | drink | plain
#    material:          vanilla material
#    name / lore:       MiniMessage text
#    custom-model-data: optional number for resource packs / Oraxen skins (0 = none)
#    glint, unbreakable, max-stack, color (#RRGGBB for potions / leather), flags (ItemFlag names)
#    enchants:          <minecraft enchantment key>: <level>
#    attributes:        list of {attribute, amount, operation (ADD_NUMBER | ADD_SCALAR | MULTIPLY_SCALAR_1), slot}
#                       slot: any | mainhand | offhand | hand | head | chest | legs | feet | armor
#                       NOTE: adding attributes replaces the vanilla weapon damage/speed, so give both.
#    always-edible / nutrition / saturation: for food materials (fruits)
#    recipe:            optional shaped crafting recipe (never used for fruits):
#                         enabled, amount, shape (3 rows), ingredients (symbol: MATERIAL or item:<id>)
#
#  Ability types (used by fruit.ability and by swords' "ability"):
#    punch        hits the entity you look at (range, damage, knockback); with nothing in sight
#                 you leap forward instead (leap-power, 0 = no leap)
#    fireball     shoots a fireball exploding in an area (speed, radius, damage, fire-ticks)
#    nova         damages everything around you (radius, damage, effects, freeze-ticks)
#    lightning    strikes what you look at (range, radius, damage)
#    invisibility become invisible for "duration" seconds; with toggle: true, using it again ends it
#    swap         swap places with the entity you look at (range, damage)
#    pull         pulls everything in the radius towards you (radius, pull-strength, damage, effects)
#    transform    gives yourself self-effects for "duration" seconds
#    dash         dash forward hitting everything you pass (power, dash-ticks, damage)
#    slash        flying slash in a line (range, damage)
#  Common options: name, cooldown (seconds), damage, effects (applied to victims, effect:level[:seconds]),
#    effect-seconds, self-effects (effect:level, length = duration), duration, fire-ticks, freeze-ticks,
#    knockback, particle (Particle name or none), sound (minecraft sound key), sound-pitch.
#  Ability damage is normal player damage: crewmates, PvP-off worlds and protected areas are respected.
items:

  # ================================ ABYSS FRUITS ================================
  #  fruit.passives:   permanent effects (effect:level)
