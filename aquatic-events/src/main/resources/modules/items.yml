# -------------------------------------------------------------------------------------
#  Messages (MiniMessage). Placeholders are written as <name>.
# -------------------------------------------------------------------------------------
# How players learn the custom recipes: they are unlocked in the vanilla recipe book (green book in the
# crafting table) and /recipes opens a menu with every recipe.
recipes:
  unlock-in-recipe-book: true

# Custom textures (the AquaticSMP resource pack, see the README). Turn this on only once your server
# sends the pack to players (server.properties resource-pack=...), or they see a missing texture.
# Items with "item-model" / "equipment-model" then use their own look; turning it off restores the normal look.
resource-pack:
  enabled: false

