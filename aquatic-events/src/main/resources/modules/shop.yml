# Treasure map shop entries ("treasure-map", "treasure-map:epic", "treasure-map:legendary"): a map to a
# treasure that is already out there (see shop-maps in treasure.yml). <left> = maps of that kind left.
treasure-map:
  names:
    standard: "<gold>Treasure Map <gray>(common to rare)"
    epic: "<light_purple>Epic Treasure Map"
    legendary: "<gradient:#ffcc00:#ff6a00><bold>Legendary Treasure Map</bold></gradient>"
  lore:
    - "<gray>A map to a treasure that is already buried."
    - "<gray>2 or 3 pirates get the same map: <yellow>it's a race!"
    - ""
    - "<white>Maps left: <yellow><left>"
    - "<dark_gray>Only for sale while such treasures exist."
messages:
  no-treasure-maps: "<red>No maps of this kind left. <gray>Every such treasure is already charted (or there are none). Try again later."
  menu-items: "<gray><count> item(s)"
  menu-open: "<yellow>Click to open"
  menu-back: "<yellow>« Back"
  menu-previous: "<yellow>« Page <page>"
  menu-next: "<yellow>Page <page> »"
  menu-balance: "<gold>Your Doubloons: <yellow><balance>"
  menu-balance-hint: "<gray>/shop sell sells what you hold"
  item-buy: "<gray>Buy: <yellow><price></yellow> <dark_gray>(<amount>x)"
  item-sell: "<gray>Sell: <green><price></green> <dark_gray>(<amount>x)"
  item-hint-both: "<dark_gray>Left: buy · Shift: stack · Right: sell · Shift-right: sell all"
  item-hint-buy: "<dark_gray>Left: buy · Shift-left: a stack"
  item-hint-sell: "<dark_gray>Right: sell · Shift-right: sell all"
  bought: "<green>Bought <white><amount>x <item></white> for <yellow><price></yellow>."
  sold: "<green>Sold <white><amount>x <item></white> for <yellow><price></yellow>."
  no-money: "<red>You need <yellow><price></yellow> for that."
  not-for-sale: "<red>The market doesn't sell this."
  not-buying: "<red>The market doesn't buy this."
  nothing-to-sell: "<red>You need at least <white><amount></white> of these to sell."
  hand-not-sellable: "<red>The market doesn't buy what you're holding."
  unavailable: "<red>This item is unavailable right now."
  unknown-category: "<red>No category <white><category></white>. <gray>Categories: <white><categories>"
  hold-item: "<red>Hold the item you want to add."
  bad-index: "<red>Pick a number between 1 and <max>. <gray>(/shop admin list <category>)"
  admin-added: "<green>Added <white><item></white> to <white><category></white> as #<index>."
  admin-removed: "<green>Removed #<index> from <white><category></white>."
  admin-price: "<green>Updated the price of #<index> in <white><category></white>."
  admin-category: "<green>Category <white><category></white> updated. <gray>(rename it in shop.yml)"
  admin-list-entry: "<gray>#<index> <white><item></white> x<amount> <dark_gray>|</dark_gray> buy <yellow><buy></yellow> <dark_gray>|</dark_gray> sell <green><sell>"
