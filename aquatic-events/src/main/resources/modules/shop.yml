# =====================================================================================
#  AquaticSMP - Harbor Market (the shop)
#  /shop opens it. Left-click = buy, shift-left = buy a stack, right-click = sell,
#  shift-right = sell all. /shop sell sells what you hold.
#
#  Edit in-game (no YAML needed):
#    hold an item  ->  /shop admin add <category> <buy price> [sell price] [amount per purchase]
#    /shop admin list <category>          (numbers for the commands below)
#    /shop admin price <category> <number> <buy> <sell>
#    /shop admin remove <category> <number>
#    /shop admin category create <id> [icon] [slot]  |  /shop admin category delete <id>
#
#  Items here: "MATERIAL" (vanilla) or "item:<id>" (custom items). amount = items per purchase.
#  buy 0 = can't be bought, sell 0 = the shop doesn't buy it back.
# =====================================================================================
