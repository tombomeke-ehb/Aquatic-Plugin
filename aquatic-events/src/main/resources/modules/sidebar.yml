# =====================================================================================
#  AquaticSMP - Sidebar
#  The stats panel on the right side of the screen. Players hide/show it with /sidebar.
#  While the tournament (or another plugin) shows its own scoreboard, the sidebar steps aside.
#  If you use the TAB plugin for scoreboards, set enabled: false.
# =====================================================================================
enabled: true
# How often the lines refresh (ticks, 20 = 1 second).
update-ticks: 20

title: "<gradient:#1fa2ff:#12d8fa><bold>AQUATIC SMP</bold></gradient>"

# Up to 15 lines, top to bottom (MiniMessage).
# Tags: <player> <level> <level_title> <xp_bar> <xp_percent> <balance> <bounty> <bounty_title> <crew> <crew_online>
#       <rank> <reputation> <island> <island_type> <island_rarity> <island_owner> <fruit> <fruit_level>
#       <move> <move_cd> <combat> <event> <event_time> <conqueror> <online> <x> <z>
# Start a line with "?<condition>:" to only show it when that applies:
#   crew, nocrew, island, sea, fruit, nofruit, event, bounty, conqueror, combat
# Do not edit: used to upgrade this file when the plugin updates.
config-version: 2

layout:
  - "<dark_gray><strikethrough>                         "
  - "<white><bold><player></bold> <level_title>"
  - "<gray>Lv <aqua><level></aqua> <xp_bar> <dark_gray><xp_percent>%"
  - "<gray>Doubloons: <yellow><balance>"
  - "?bounty:<gray>Bounty: <red><bounty>"
  - "?bounty:<dark_gray>» <bounty_title>"
  - "?crew:<gray>Crew: <crew> <dark_gray>(<crew_online>)"
  - "?crew:<gray>Rank: <white><rank>"
  - "?nocrew:<gray>Crew: <dark_gray>none <gray>· /crew"
  - "?island:<aqua><island> <dark_gray>· <island_rarity>"
  - "?island:<gray>» <island_owner>"
  - "?sea:<dark_aqua>Open sea <dark_gray>(<x>, <z>)"
  - "?fruit:<gray>Power: <fruit> <light_purple>M<fruit_level>"
  - "?fruit:<gray>Move: <move> <move_cd>"
  - "?combat:<red><bold>⚔ IN COMBAT</bold> <white><combat>s"
  - "?event:<gold>⚑ <event> <gray><event_time>"
  - "<dark_gray><strikethrough>                         "

messages:
  none: "<dark_gray>none"
  move-ready: "<green>ready"
  move-cooldown: "<red><seconds>s"
  open-sea: "<dark_aqua>Open sea"
  island-neutral: "<green>Safe zone"
  island-unclaimed: "<gray>Unclaimed"
  hidden: "<gray>Sidebar hidden. <white>/sidebar</white> brings it back."
  shown: "<green>Sidebar shown."
