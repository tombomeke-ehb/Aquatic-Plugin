# =====================================================================================
#  AquaticSMP - Sidebar
#  The stats panel on the right side of the screen. Players hide/show it with /sidebar.
#  While the tournament (or another plugin) shows its own scoreboard, the sidebar steps aside.
#  If you use the TAB plugin for scoreboards, set enabled: false.
# =====================================================================================
enabled: true
# How often the lines refresh (ticks, 20 = 1 second).
update-ticks: 20

title: "<gradient:#1fa2ff:#12d8fa><bold>AQUATIC SMP</bold></gradient>"

# Up to 15 lines, top to bottom (MiniMessage). Every line must be different: add a space at the end
# of an empty line to make it unique ("", " ", "  ").
# Tags: <player> <balance> <bounty> <crew> <rank> <reputation> <island> <island_owner> <fruit>
#       <event> <event_time> <conqueror> <online> <x> <z> <move> <move_cd>
# Start a line with "?crew:", "?nocrew:", "?island:", "?sea:", "?fruit:", "?event:", "?bounty:" or
# "?conqueror:" to only show it when that applies.
lines:
  - "<dark_gray>━━━━━━━━━━━━━━━"
  - "<gray>Doubloons: <yellow><balance>"
  - "?bounty:<gray>Bounty: <red><bounty>"
  - "?crew:<gray>Crew: <crew>"
  - "?crew:<gray>Rank: <white><rank> <dark_gray>(<reputation> rep)"
  - "?nocrew:<gray>Crew: <dark_gray>none <gray>(/crew)"
  - " "
  - "?island:<aqua><island>"
  - "?island:<gray>» <island_owner>"
  - "?sea:<dark_aqua>Open sea <dark_gray>(<x>, <z>)"
  - "?fruit:<gray>Power: <fruit>"
  - "?fruit:<gray>Move: <move> <move_cd>"
  - "?event:  "
  - "?event:<gold>Event: <event>"
  - "?event:<gray>Ends in <white><event_time>"
  - "<dark_gray>━━━━━━━━━━━━━━━ "

messages:
  none: "<dark_gray>none"
  move-ready: "<green>ready"
  move-cooldown: "<red><seconds>s"
  open-sea: "<dark_aqua>Open sea"
  island-neutral: "<green>Safe zone"
  island-unclaimed: "<gray>Unclaimed"
  hidden: "<gray>Sidebar hidden. <white>/sidebar</white> brings it back."
  shown: "<green>Sidebar shown."
