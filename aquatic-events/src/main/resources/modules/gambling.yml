# =====================================================================================
#  AquaticSMP - The gambling den
#  Doubloons only. Talk to the Dealer at spawn (hub.yml) or use /gamble. Games:
#    /dice <bet>                 two dice against the dealer's two dice
#    /wheel <bet>                spin the wheel of fortune (a multiplier on your bet)
#    /coinflip <player> <bet>    a coin flip between two players (/coinflip accept | deny)
#  The house keeps a small edge on every game, so the den takes Doubloons out of the economy.
#  Big wins and losses are written to plugins/AquaticSMP/data/gambling.log.
# =====================================================================================
config-version: 1

# Only on the capital island (where the den is). Staff with aquatic.gambling.anywhere can play anywhere.
only-at-capital: true
# Pirate level needed to play (keeps fresh alts from farming).
min-level: 5
min-bet: 10
max-bet: 5000
# How much one player may bet in total per day (0 = no limit).
daily-limit: 25000
# Seconds between bets.
cooldown-seconds: 3
# Wins or losses at least this big go to the log.
log-threshold: 2000
# A win (payout minus bet) at least this big is announced to everyone.
broadcast-win: 10000
# The bet buttons in the /gamble menu.
bet-presets: [50, 100, 250, 500, 1000, 2500, 5000]

dice:
  enabled: true
  # Higher total than the dealer: you get bet x this.
  win-multiplier: 2.0
  # Same total: push (bet back), half (half back) or lose.
  tie: half

wheel:
  enabled: true
  # How many items pass by before it stops.
  steps: 36
  # The house edge is the expected payout below 1.0: with these weights it pays back about 93% on average.
  segments:
    - {label: "<dark_gray>Nothing", multiplier: 0, weight: 45, icon: BLACK_STAINED_GLASS_PANE}
    - {label: "<red>Half back", multiplier: 0.5, weight: 20, icon: RED_STAINED_GLASS_PANE}
    - {label: "<yellow>x1.5", multiplier: 1.5, weight: 17, icon: YELLOW_STAINED_GLASS_PANE}
    - {label: "<green>x2", multiplier: 2, weight: 10, icon: LIME_STAINED_GLASS_PANE}
    - {label: "<aqua>x3", multiplier: 3, weight: 6, icon: LIGHT_BLUE_STAINED_GLASS_PANE}
    - {label: "<gold><bold>x10 JACKPOT", multiplier: 10, weight: 2, icon: GOLD_BLOCK}

coinflip:
  enabled: true
  # Part of the pot the house keeps.
  house-cut: 0.05
  # How long a challenge stays open.
  expire-seconds: 60

