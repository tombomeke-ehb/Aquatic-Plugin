# =====================================================================================
#  AquaticSMP - Events module (modules/events.yml)
# =====================================================================================
#  Seven server events, started by staff or by the optional auto-scheduler.
#
#  Commands (/seaevent, aliases /event, /sevent):
#    /seaevent start <type> [args]            aquatic.events.admin
#        treasure_hunt [tier]
#        pirate_war [crewA crewB]             (no crews = auto-pick two crews at WAR / RIVAL)
#        bounty_hunt
#        lost_island [island name]
#        kings_challenge
#        grand_raid [location name | island id]
#        naval_battle
#    /seaevent stop [type] [finish]           aquatic.events.admin  (finish = end now WITH results)
#    /seaevent list                           aquatic.events.admin
#    /seaevent schedule <on|off>              aquatic.events.admin
#    /seaevent setlocation <event> [name] [remove]   aquatic.events.admin
#        kings_challenge hill     -> the hill (otherwise the first CAPITAL island is used)
#        grand_raid [name]        -> raid spots ("default" is used without arguments)
#        naval_battle             -> centre of the battle zone (when zone-radius > 0)
#    /seaevent info                           aquatic.events.info  (everyone)
#    /seaevent join [type]                    aquatic.events.join  (everyone)
#
#  Rewards (per event, under rewards.<section>):
#    doubloons: 1000            paid to each rewarded player (economy module)
#    items: [ "DIAMOND:3", "item:rum:2" ]   vanilla MATERIAL[:amount] or item:<custom id>[:amount]
#    commands: [ "say {player} won" ]       console commands, {player} placeholder
#    reputation: 50             crew reputation
#    crew-bank: 5000            (crew rewards only) doubloons into the crew bank
#  For crew rewards ("winner" of pirate_war, kings_challenge, naval_battle) the doubloons/items/
#  commands are given to every ONLINE member, crew-bank and reputation once to the crew.
#  Anything whose module is disabled is skipped silently.
# =====================================================================================

# How many events may run at the same time.
max-concurrent: 1

scheduler:
  # Start a random event automatically (can be toggled in-game with /seaevent schedule on|off).
  enabled: false
  interval-minutes: 90
  # Minimum online players for an automatic event.
  min-players: 5
  # Relative chance per event type (0 = never picked automatically).
  weights:
    treasure_hunt: 30
    pirate_war: 10
    bounty_hunt: 15
    lost_island: 15
    kings_challenge: 10
    grand_raid: 15
    naval_battle: 5

sounds:
  start: item.goat_horn.sound.2

events:
  # Common keys: enabled, display-name, description, duration-minutes, min-players (only checked by
  # the scheduler; staff can always /seaevent start), bossbar, bossbar-color
  # (PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE), join-teleport (/seaevent join teleports there).

  treasure_hunt:
    enabled: true
    display-name: "<gold>Treasure Hunt"
    description: "<gray>A legendary treasure was buried! Follow the hints and dig it up first."
    duration-minutes: 30
    min-players: 3
    bossbar-color: YELLOW
    # Treasure tier (from the treasure module) used when no tier is given.
    tier: legendary
    # Treasure maps handed to the captains (or a random member) of this many random online crews.
    treasure-maps: 2
    hint-interval-seconds: 120
    # Hint precision in blocks, one per hint (0 = name of the island / world). The last one repeats.
    hint-precision: [0, 500, 200, 75, 25]
    rewards:
      winner:
        doubloons: 2500
        reputation: 50
        items: []
        commands: []

  pirate_war:
    enabled: true
    display-name: "<red>Pirate War"
    description: "<gray>An official war between two crews. The crew with the most kills wins!"
    duration-minutes: 30
    min-players: 4
    bossbar-color: RED
    # Relations searched (in this order) when crews are picked automatically.
    auto-relations: [WAR, RIVAL]
    min-online-per-crew: 2
    # End early when a crew reaches this many kills (0 = play the full duration).
    kill-target: 0
    announce-kills: true
    # Reputation change for the losing crew.
    loser-reputation: -25
    rewards:
      winner:
        crew-bank: 5000
        reputation: 100
        doubloons: 500
        items: []
        commands: []

  bounty_hunt:
    enabled: true
    display-name: "<dark_red>Bounty Hunt"
    description: "<gray>Extra bounties are placed on wanted pirates. Claim the most bounty value to win!"
    duration-minutes: 30
    min-players: 4
    bossbar-color: PURPLE
    # Number of targets that receive an extra event bounty.
    targets: 3
    # Minimum number of targets needed to start.
    min-targets: 1
    # top = the most wanted online players first (filled up with random players); random = random online players.
    target-mode: top
    # Extra bounty added to each target (paid out by the bounty module when claimed).
    bounty-amount: 5000
    reason: "Bounty Hunt event"
    end-when-all-claimed: true
    # When the event ends, take the event bounty off targets nobody managed to claim.
    remove-unclaimed-bounties: true
    rewards:
      # The hunter with the highest total claimed value.
      winner:
        doubloons: 3000
        reputation: 50
      # Every other hunter who claimed a bounty.
      participant:
        doubloons: 250

  lost_island:
    enabled: true
    display-name: "<aqua>The Lost Island"
    description: "<gray>An ancient island rises from the sea, full of treasure... before it sinks again."
    duration-minutes: 30
    min-players: 3
    bossbar-color: GREEN
    join-teleport: false
    names:
      - "Skypiea Fragment"
      - "Fishman Ruins"
      - "Lost Isle of Ohara"
      - "Thriller Bark Wreck"
      - "Island of the Raft"
      - "Raftel's Shadow"
    # TROPICAL, JUNGLE, VOLCANIC, SNOWY, DESERT, ANCIENT or random (CAPITAL is never used).
    island-type: ANCIENT
    radius: 35
    # Treasures spawned once the island has had time to generate.
    treasures: 3
    treasure-tiers: [legendary, epic, rare]
    treasure-delay-seconds: 15
    # End (and start sinking) as soon as all treasures were found.
    end-when-looted: true
    # Warning countdown before the island sinks (0 = sink immediately).
    sink-warning-seconds: 60
    # true = the island stays forever as a normal island.
    keep-island: false
    rewards:
      # Each player who opens one of the island's treasures (on top of the treasure loot).
      finder:
        doubloons: 500
        reputation: 15

  kings_challenge:
    enabled: true
    display-name: "<gold>The King's Challenge"
    description: "<gray>Hold the throne! The crew that controls the hill the longest wins."
    duration-minutes: 15
    min-players: 4
    bossbar-color: YELLOW
    join-teleport: true
    # Location: /seaevent setlocation kings_challenge hill  (fallback: first CAPITAL island centre).
    radius: 6
    # Refuse to start when there is no Conqueror of the Sea (or the tournament module is disabled).
    require-king: false
    # Seconds counted per second for the king's own crew while it holds the hill (defender bonus).
    king-crew-points-per-second: 1
    rewards:
      winner:
        crew-bank: 4000
        reputation: 100
        doubloons: 300

  grand_raid:
    enabled: true
    display-name: "<red>Grand Raid"
    description: "<gray>The Tidewatch are attacking! Work together to repel every wave and defeat the High Warden."
    duration-minutes: 25
    min-players: 4
    bossbar-color: RED
    join-teleport: true
    # Location: /seaevent setlocation grand_raid [name], or start with an island id.
    first-wave-delay-seconds: 30
    wave-delay-seconds: 15
    spawn-radius: 14
    # Mobs that wander further than this are pulled back.
    leash: true
    leash-radius: 60
    # Extra mobs per online player beyond the first (0.1 = +10%), capped by max-scale. Bosses get extra health instead.
    scale-per-player: 0.1
    max-scale: 3.0
    drop-loot: false
    exp-per-kill: 10
    # Mob templates. type = entity type; health-multiplier OR health; damage-/speed-multiplier;
    # equipment items (MATERIAL or item:<id>); effects (effect:level); boss: true = shown on the boss bar.
    mobs:
      marine:
        type: ZOMBIE
        name: "<blue>Tidewatch Recruit"
        health-multiplier: 1.5
        damage-multiplier: 1.2
        equipment:
          helmet: LEATHER_HELMET
          chestplate: LEATHER_CHESTPLATE
          mainhand: IRON_SWORD
      marine_rifleman:
        type: SKELETON
        name: "<blue>Tidewatch Rifleman"
        health-multiplier: 1.5
        equipment:
          helmet: CHAINMAIL_HELMET
          mainhand: BOW
      marine_officer:
        type: VINDICATOR
        name: "<dark_blue>Tidewatch Lieutenant"
        health-multiplier: 2.0
        damage-multiplier: 1.2
        equipment:
          helmet: IRON_HELMET
          mainhand: IRON_AXE
      vice_admiral:
        type: PIGLIN_BRUTE
        name: "<dark_aqua>Warden Captain"
        health-multiplier: 2.5
        effects: [resistance:1]
        equipment:
          helmet: DIAMOND_HELMET
          mainhand: DIAMOND_AXE
      admiral:
        type: WITHER_SKELETON
        name: "<gold><bold>High Warden Vex"
        boss: true
        health: 400
        damage-multiplier: 1.6
        speed-multiplier: 1.15
        effects: [fire_resistance:1, resistance:1]
        equipment:
          helmet: NETHERITE_HELMET
          chestplate: NETHERITE_CHESTPLATE
          mainhand: NETHERITE_SWORD
    # Waves, in order: list of "template:count". Put the boss in the last wave.
    waves:
      - ["marine:6", "marine_rifleman:2"]
      - ["marine:6", "marine_rifleman:4", "marine_officer:1"]
      - ["marine:4", "marine_officer:3", "vice_admiral:1"]
      - ["admiral:1", "marine_officer:2", "marine_rifleman:3"]
    rewards:
      # Doubloons split between all damage dealers by their share of the total damage.
      pool-doubloons: 20000
      # Most damage dealt.
      mvp:
        doubloons: 2000
        reputation: 50
        items: ["item:shusui"]
      # Everyone who dealt damage (on top of their share).
      participant:
        items: ["item:rum:2"]

  naval_battle:
    enabled: true
    display-name: "<dark_aqua>Naval Battle"
    description: "<gray>Crews clash at sea! Kills made on the water score for your crew."
    duration-minutes: 20
    min-players: 4
    bossbar-color: BLUE
    join-teleport: false
    min-crews: 2
    # Battle zone radius around /seaevent setlocation naval_battle (0 = the whole world).
    zone-radius: 0
    # Only kills where the killer or the victim is in a boat or in water count.
    sea-only: true
    points-per-kill: 1
    # Extra points when both killer and victim are in boats.
    boat-to-boat-bonus: 1
    announce-kills: true
    # Given to every online crew member at the start (skipped when the items module is disabled).
    give-items: ["item:hand_cannon", "item:cannonball:8"]
    rewards:
      winner:
        crew-bank: 5000
        reputation: 100
        doubloons: 500
      # Everyone who scored a kill.
      participant:
        doubloons: 100

