# =====================================================================================
#  AquaticSMP - Tournament module (modules/tournament.yml)
# =====================================================================================
#  The Conqueror of the Sea tournament. Requires the "crews" module.
#
#  Flow (staff-driven, automated in between):
#    1. Registration  /tournament open [minutes]   crew officers: /tournament register
#    2. Qualifiers    crews earn points for kills, treasure, islands, bounties
#    3. Bracket       single elimination crew-vs-crew arena fights (byes for odd counts)
#    4. Grand finale  best-of-N
#    5. Coronation    the captain of the winning crew becomes the Conqueror of the Sea
#
#  Player commands (everyone by default):
#    /tournament register | unregister            aquatic.tournament.register (crew officers only)
#    /tournament roster [add|remove <member>]     aquatic.tournament.register
#    /tournament standings | bracket | info       aquatic.tournament.view
#    /hallofconquerors                                 aquatic.tournament.view
#  Staff commands (aquatic.tournament.admin):
#    /tournament open [minutes] | start | next | cancel | status | forcewin <crew>
#    /tournament arena create <name> | setspawn <name> <1|2> | setspectator <name> | delete <name> | list
#    /tournament setlobby  (also /tournament arena setlobby)
#    /tournament admin setking <player|none>
#
#  State (stage, entries, bracket) is saved to data/tournament/state.yml, so a restart during
#  registration, qualifiers or the bracket resumes. A match that was running at shutdown is
#  aborted (everyone restored) and simply replayed.
# =====================================================================================

# Do not edit: used to upgrade this file when the plugin updates.
config-version: 1

teams:
  # Fighters per crew in a match.
  size: 3
  # When roster members are offline, fill the team with other online crew members.
  fill-missing: true

registration:
  # Default registration time for "/tournament open" without minutes (0 = until /tournament start).
  default-minutes: 30
  # Minimum registered crews; with fewer the tournament is cancelled when registration ends.
  min-crews: 2
  # Maximum registered crews (0 = unlimited).
  max-crews: 0
  # Minimum crew members to be allowed to register.
  min-members: 1
  # Doubloons taken from the crew bank when registering (0 = free).
  entry-fee: 0
  refund-on-unregister: true

qualifiers:
  # false = skip the points phase; seeding uses crew reputation instead.
  enabled: true
  duration-minutes: 60
  # How many crews advance to the bracket (rounded down to a power of two: 2, 4, 8, 16...).
  # Fewer crews registered -> all of them advance, missing slots become byes.
  advance: 8
  # Show live standings in a sidebar scoreboard to registered crew members.
  sidebar: true
  # Show that sidebar to every online player instead.
  sidebar-everyone: false
  # Broadcast the top 3 every X seconds (0 = off).
  broadcast-interval-seconds: 300
  # Action bar message when you earn points.
  notify-points: true
  points:
    # Killing a member of another registered crew.
    pvp-kill-entrant: 10
    # Killing a player who is not in a registered crew.
    pvp-kill-other: 0
    # Mob kills by entity type ("default" for all others).
    mob-kills:
      default: 0
      ZOMBIE: 1
      SKELETON: 1
      SPIDER: 1
      CREEPER: 2
      DROWNED: 2
      PILLAGER: 3
      VINDICATOR: 4
      EVOKER: 8
      ELDER_GUARDIAN: 25
      WARDEN: 50
      WITHER: 50
      ENDER_DRAGON: 75
    # Treasure found, by treasure tier ("default" for unknown tiers).
    treasure:
      default: 5
      common: 5
      rare: 12
      epic: 20
      legendary: 30
    island-claim: 15
    island-conquer: 30
    # Bounty claimed: base + amount * per-doubloon.
    bounty-claim: 5
    bounty-per-doubloon: 0.01

bracket:
  # Seconds after a match before the next one starts automatically (-1 = staff runs /tournament next).
  auto-next-delay-seconds: 30
  # Display names by number of matches in the round (others: "Round of N").
  round-names:
    1: "Grand Finale"
    2: "Semi-finals"
    4: "Quarter-finals"

match:
  # Freeze countdown before the fight.
  countdown-seconds: 5
  # Time limit; when it runs out "sudden death" decides: the team with more survivors wins,
  # then the team with the most total health, then a coin flip.
  time-limit-seconds: 300
  # own-gear = fighters use their own inventory (nothing is lost: deaths keep everything)
  # kit      = inventories are saved, the kit below is given, and the inventory is restored afterwards
  gear: own-gear
  kit:
    # Item specs: MATERIAL[:amount] or item:<custom item id>[:amount]
    items:
      - IRON_SWORD
      - BOW
      - ARROW:32
      - COOKED_BEEF:16
      - GOLDEN_APPLE:2
    armor:
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: IRON_LEGGINGS
      boots: IRON_BOOTS
      offhand: SHIELD
    # Effects for the whole match (effect:level).
    effects: []
  # Remove potion effects when entering the arena.
  clear-effects: true
  # Where fighters go after the match: previous (where they were) | lobby (/tournament setlobby)
  return-to: previous
  # Fighters cannot teleport away (ender pearls inside the arena are allowed).
  block-teleports: true
  # Fighters cannot use commands except these (staff bypass).
  block-commands: true
  allowed-commands: [msg, tell, w, r, me]

finale:
  # The grand finale is best-of-N games (odd number).
  best-of: 3

coronation:
  # Give the crown item (from the items module) to the new king. Skipped when the items module is off.
  give-crown: true
  crown-item: conqueror_crown
  # Fireworks launched around the king.
  fireworks: 10
  prize:
    # Doubloons into the crew bank.
    crew-bank: 50000
    # Doubloons for every roster member (and the captain).
    per-fighter: 5000
    # Extra doubloons for the king himself.
    king: 10000
    # Crew reputation.
    reputation: 500
    # Console commands. Placeholders: {player} {uuid} {crew} {season}
    commands: []
    #  - "lp user {player} parent add conqueror"

king-perks:
  # The Conqueror of the Sea glows.
  glow: true
  # Particle trail (Particle name, or none).
  particle: END_ROD
  # "The Conqueror of the Sea has arrived" broadcast on join.
  join-broadcast: true

sounds:
  announce: item.goat_horn.sound.0
  finale: entity.wither.spawn
  match-won: ui.toast.challenge_complete
  coronation: ui.toast.challenge_complete
  king-join: item.goat_horn.sound.1

