      - {material: BREAD, amount: 3-6, weight: 5}
      - {material: ARROW, amount: 8-24, weight: 5}
      - {material: GUNPOWDER, amount: 2-6, weight: 4}
      - {material: NAUTILUS_SHELL, amount: 1, weight: 1.5}
      - {material: NAME_TAG, amount: 1, weight: 1}
      - {material: LEATHER_HELMET, weight: 2, name: "<gold>Weathered Tricorn", lore: ["<gray>Smells of salt and rum."]}
      - {custom-item: smoke_bomb, amount: 1-2, weight: 1.5}
      - {doubloons: 20-60, weight: 4}
  uncommon:
