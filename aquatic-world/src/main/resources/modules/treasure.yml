    chest: CHEST
    rolls: 3-5
    doubloons: 50-120
    depth: 2
    marker: true
    weight: 7
    broadcast: false
    reputation: 2
    vanish: empty
    particles: none
    beam: false
    loot:
      - {material: GOLD_INGOT, amount: 2-6, weight: 8}
