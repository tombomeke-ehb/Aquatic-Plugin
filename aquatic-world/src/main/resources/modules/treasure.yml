# =====================================================================================
#  AquaticSMP - TREASURE module
#  Buried chests, treasure maps with a red X and the hunt for them.
#
#  Quick start (admin commands need aquatic.treasure.admin, ops have it):
#    /treasure spawn legendary          bury a legendary chest where you stand
#    /treasure spawn rare random        bury one on a random island
#    /treasure map epic Steve           bury an epic chest somewhere and give Steve the map
#    /treasure list | tp <n> | remove <n|all> | give-loot <tier>
#  Players: /treasure info, and right-click a treasure map for hot/cold hints.
#
#  Works without the islands module (random land inside random-area is used instead),
#  Doubloon payouts need the economy module, custom-item loot needs the items module
#  (entries are skipped silently when it is off).
# =====================================================================================

autosave-seconds: 120

# -------------------------------------------------------------------------------------
# Loot tiers. Add as many as you like; the key is the tier id used in commands.
#   display-name   MiniMessage name (colour = tier colour)
#   chest          CHEST, TRAPPED_CHEST or BARREL
#   rolls          how many loot entries are rolled ("min-max")
#   doubloons      Doubloons paid to the finder on opening ("min-max")
#   depth          blocks of earth above the chest (0 = sits on the surface)
#   marker         put an X (see marker:) on the ground above it
#   weight         default chance weight when no tier-weights are given
#   broadcast      announce the find to the whole server
#   reputation     reputation for the finder's crew
#   vanish         empty = chest disappears once emptied and closed
#                  close = disappears when closed (leftovers drop on the ground)
#                  never = chest stays
#   particles      particle shown above it to nearby players (none, HAPPY_VILLAGER, ENCHANT, WAX_ON, ...)
#   beam           column of light visible from further away (makes it easy to find!)
#   loot           list of entries:
#       material: ITEM            amount: "min-max"      weight: relative chance
#       enchants: [SHARPNESS:1-3, UNBREAKING:2]           (books get stored enchantments)
#       random-enchant-level: 20-30   treasure-enchants: true   (enchanting-table style)
#       name: "<gold>Cool name"   lore: ["<gray>line"]
#       custom-item: <id>         (items module)
#       doubloons: "min-max"      (entry that pays Doubloons instead of / besides an item)
# -------------------------------------------------------------------------------------
tiers:
  common:
    display-name: "<gray>Common</gray>"
    chest: BARREL
    rolls: 3-5
    doubloons: 25-75
    depth: 1
    marker: true
    weight: 10
    broadcast: false
    reputation: 1
    vanish: empty
    particles: none
    beam: false
    loot:
      - {material: GOLD_NUGGET, amount: 4-16, weight: 10}
      - {material: GOLD_INGOT, amount: 1-4, weight: 6}
      - {material: IRON_INGOT, amount: 2-6, weight: 8}
      - {material: EMERALD, amount: 1-4, weight: 5}
