# -------------------------------------------------------------------------------------
# Placement
# -------------------------------------------------------------------------------------
placement:
  # Search radius around the requested spot for dry, solid ground.
  search-radius: 6
  # Statuses of islands natural/random treasure may appear on.
  island-statuses: [UNCLAIMED, OCCUPIED]
  # Only use the inner part of the island (fraction of the radius), away from the beach.
  island-inner-fraction: 0.6

# Used when the islands module is off or no island qualifies: random dry land in this area.
random-area:
  world: world
  center-x: 0
  center-z: 0
  radius: 2000
  attempts: 12

# The X that marks the spot.
marker:
  enabled: true
  block: RED_WOOL
  # Arm length of the X (1 = 5 blocks, 2 = 9 blocks).
  size: 1
  # Put the original ground back once the treasure is found.
  remove-on-find: true

# Name shown at the top of the chest window.
chest-name:
  enabled: true
  format: "<tier> Treasure"

effects:
  # How often particles/beams are drawn (ticks) and how close players must be.
  interval-ticks: 40
  range: 24

# -------------------------------------------------------------------------------------
# Natural spawning
# -------------------------------------------------------------------------------------
natural:
  enabled: true
  interval-minutes: 20
  # Never more than this many naturally spawned treasures at once.
  max-active: 8
  min-players-online: 1
  # Unfound natural treasures crumble away after this many hours (0 = never).
  expire-hours: 48
  # Announce the rumour to the server (island name + rough hint, not the location).
  announce: true
  tier-weights:
    common: 10
    uncommon: 7
    rare: 5
    epic: 2
    legendary: 0.4

# Treasure maps dropping from sea creatures / fishing. Each drop buries a fresh treasure.
map-drops:
  # Chance per kill / catch (0.02 = 2%).
  chances:
    drowned: 0.02
    guardian: 0.03
    elder-guardian: 0.5
    fishing: 0.005
  require-player-kill: true
  # No drops while this many treasures are active.
  max-active: 15
  tier-weights:
    common: 8
    uncommon: 6
    rare: 5
    epic: 2
    legendary: 0.5

# -------------------------------------------------------------------------------------
# Treasure maps
# -------------------------------------------------------------------------------------
maps:
  # The map is centred up to this many blocks away from the chest so the X is not dead centre.
  center-jitter: 40
  # CLOSEST, CLOSE, NORMAL, FAR, FARTHEST
  scale: CLOSE
  # Rounding of coordinates in hints when the treasure is not on an island.
  coordinate-rounding: 100
  name: "<gold>Treasure Map <dark_gray>(<tier><dark_gray>)"
  lore:
    - "<gray>A weathered chart, smudged with salt."
    - "<gray>Island: <white><island>"
    - "<gray>The X lies <white><hint></white>."
    - ""
    - "<yellow>Right-click while holding it"
    - "<yellow>to sense how close you are."
  gone-name: "<gray>Looted Treasure Map"
  gone-lore:
    - "<dark_gray>Someone beat you to it..."
    - "<dark_gray>Only an empty hole remains."
  hints:
    cooldown-ms: 1000
    # Compass direction only shown when farther than this (blocks).
    show-direction-above: 12
    # Rounded distance shown when farther than show-distance-above (0 = never show distance).
    distance-rounding: 50
    show-distance-above: 80
    # "hot/cold": the first level whose distance (blocks) is >= the real distance is shown.
    levels:
      4: "<red><bold>BURNING!</bold> Dig right here!"
      12: "<red>Hot!"
      35: "<gold>Warm"
      90: "<yellow>Lukewarm"
      250: "<aqua>Cold"
    beyond: "<blue>Freezing - the X is far away"

info:
  # /treasure info names the islands that hold treasure.
  reveal-islands: true

# =====================================================================================
#  Messages
# =====================================================================================
messages:
  no-island-name: "uncharted land"
  hint-heart: "in the heart of the island"
  hint-inland: "inland, toward the <direction>"
  hint-shore: "near the <direction> shore"
  hint-coords: "somewhere around X <x>, Z <z>"
  hint-direction: "<gray>- the X lies to the <white><direction></white>"
  hint-distance: "<gray>(~<distance> blocks)"
  map-hint: "<temperature> <direction> <distance>"
  map-gone: "<gray>The ink has faded... this treasure was already dug up."
  map-wrong-world: "<gray>This map is of another world entirely."
  natural-spawn: "<gold>Rumours spread of a <tier> <gold>treasure buried on <yellow><island></yellow>, <hint>!"
  found: "<gold>You dug up a <tier> <gold>treasure on <yellow><island></yellow>!"
  found-broadcast: "<gold><bold>X MARKS THE SPOT!</bold> <yellow><player></yellow> <gold>dug up a <tier> <gold>treasure on <yellow><island></yellow>!"
  found-doubloons: "<gold>The chest held <yellow><amount></yellow>!"
  found-reputation: "<gold><player> found a <tier> <gold>treasure: <green>+<reputation></green> crew reputation."
  map-dropped: "<gold>A soggy treasure map washed out of the creature!"
  map-fished: "<gold>You fished up a bottle with a treasure map inside!"
  info-header: "<gold>Treasure hunters' rumours: <yellow><count></yellow> chest(s) still buried."
  info-tier: "<dark_gray>- <tier><gray>: <white><count>"
  info-islands: "<gray>Whispers mention: <white><islands>"
  info-tip: "<gray>Treasure maps drop from drowned, guardians and fishing."
  unknown-tier: "<red>Unknown tier <white><tier></white>. Tiers: <gray><tiers>"
  bad-index: "<red>Index must be between 1 and <max>."
  spawn-failed: "<red>Couldn't find a spot for the treasure (needs dry, solid ground)."
  spawned: "<green>Buried a <tier> <green>treasure at <white><x>, <y>, <z></white> <gray>(<island>)"
  map-received: "<gold>You received a <tier> <gold>treasure map. Happy hunting!"
  map-given: "<green>Gave <player> a <tier> <green>map (treasure at <x>, <y>, <z>)."
  list-empty: "<gray>No treasure is buried right now."
  list-header: "<gold>Active treasures: <yellow><count>"
  list-entry: "<gray>#<index> <tier> <white><x>, <y>, <z></white> <gray>(<world>, <island>) <dark_gray><age> old, <source>"
  removed: "<yellow>Removed the treasure at <x>, <y>, <z>."
  removed-all: "<yellow>Removed <count> treasure(s)."
  loot-preview: "<green>Rolled <count> item(s) from <tier><green> plus <yellow><doubloons></yellow>."
