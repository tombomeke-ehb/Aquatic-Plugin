      - {material: SPYGLASS, amount: 1, weight: 2}
      - {material: GOLDEN_CARROT, amount: 4-10, weight: 4}
      - {material: EXPERIENCE_BOTTLE, amount: 2-6, weight: 3}
      - {material: IRON_PICKAXE, weight: 2, random-enchant-level: 5-12, name: "<white>Deckhand's Pick"}
