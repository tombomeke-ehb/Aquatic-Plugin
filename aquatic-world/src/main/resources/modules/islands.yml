# -------------------------------------------------------------------------------------
# Spawn island (set with /island setspawn; it is made NEUTRAL)
# -------------------------------------------------------------------------------------

# Spawn point, set in-game with /island admin setspawn (exactly where you stand).
spawn:
  # New players start at the spawn point.
  teleport-on-first-join: true
  # Send everyone to spawn on every join (e.g. a lobby-style spawn).
  teleport-on-every-join: false
  # Players without a bed / respawn anchor respawn at the spawn point.
  respawn-here: true
presence:
  # How often (ticks) player positions are checked; players are only re-checked when they changed block.
  check-interval-ticks: 10
  # How entering / leaving an island is shown, every time it happens:
  #   title     = a short title in the middle of the screen (default)
  #   actionbar = a line above the hotbar
  #   both      = title + action bar
  #   chat      = a chat message
  #   none      = nothing
  # (The very first visit of an island always shows the big discovery title, see "discovery".)
  enter-display: title
  leave-display: title
  # The same enter/leave message is not repeated within this many seconds (stops spam when sailing
  # along a coastline that crosses the island border back and forth). 0 = always show.
  repeat-cooldown-seconds: 5
  # Title timing in ticks (20 ticks = 1 second).
  title-fade-in-ticks: 8
  title-stay-ticks: 40
  title-fade-out-ticks: 12

discovery:
  enabled: true
  # Big title on the first visit of an island.
  title: true
  sound: ui.toast.challenge_complete
  sound-volume: 0.8
  sound-pitch: 1.0
  # Doubloons for discovering an island (needs the economy module). Per-type values override.
  reward: 25
  reward-per-type:
    VOLCANIC: 50
    ANCIENT: 50
    CAPITAL: 10

# /island map (alias /island near)
map:
  count: 8
  # Distances are rounded to this many blocks.
  distance-rounding: 10
  # Islands the player has not discovered show as "???" (admins always see names).
  hide-undiscovered-names: true

# -------------------------------------------------------------------------------------
# Claiming (/island claim, needs the crews module; only Captain / First Mate)
# -------------------------------------------------------------------------------------
claiming:
  enabled: true
  # Maximum islands per crew (0 = unlimited).
  max-per-crew: 3
  # Minimum crew size to claim.
  min-members: 1
  # Price: cost + cost-per-owned-island * islands already owned.
  cost: 1000
  cost-per-owned-island: 500
  # bank = paid from the crew bank, player = paid by the claiming officer (needs the economy module).
  pay-from: bank
  # Reputation the crew gains for claiming.
  reputation: 10
  # Optional protection from conquest right after claiming (seconds, 0 = none).
  shield-seconds: 600
  # Server-wide announcement (otherwise only the crew is told).
  announce: true
  # Types that cannot be claimed at all.
  unclaimable-types: [CAPITAL]

flag:
  # The flag pole: this many blocks of pole-material with the crew banner on top.
  pole-height: 3
  pole-material: OAK_FENCE
  # Banner used when the crew has no flag.
  default-banner: WHITE_BANNER

# -------------------------------------------------------------------------------------
# Protection
# -------------------------------------------------------------------------------------
protection:
  # May anyone build on unclaimed islands?
  unclaimed-build: true
  unclaimed-explosions: true
  # Allies of the owning crew may build on its islands.
  allies-can-build: true
  occupied:
    # Containers (chests, barrels, furnaces, ...) count as protected for non-members.
    protect-containers: true
    # Explosions on occupied islands: raid = only while the island can be raided, always, never.
    explosions: raid
    fire-spread: false
    # Endermen etc. may change blocks on occupied islands.
    mob-griefing: true
  neutral:
    pvp: false
    # Use doors, buttons, levers... on neutral islands.
    allow-interact: true
    # Open chests (e.g. shops) on neutral islands.
    allow-containers: false

# Anyone may dig straight down to a buried treasure chest and open it, even on claimed or neutral
# islands (only the blocks right above the chest, nothing around it). false = island protection applies.
treasure-digging: true

# -------------------------------------------------------------------------------------
# Island development: upgrades a crew buys from its crew bank (/island manage or /island upgrade).
# Only Captain and First Mate can buy. costs = price of level 1, 2, 3, ... (the list length is the max level).
# per-level = effect strength per level.
# -------------------------------------------------------------------------------------
upgrades:
  enabled: true
  # When an island is conquered: keep | lose-one (every upgrade drops a level) | reset
  on-conquest: lose-one
  types:
    treasury:
      display-name: "<gold><bold>Treasury"
      icon: GOLD_BLOCK
      description:
        - "<gray>More passive income from this island."
        - "<gray>+25% income per level."
      per-level: 0.25
      costs: [2000, 4000, 8000, 15000, 25000]
    fortress:
      display-name: "<red><bold>Fortress"
      icon: IRON_BARS
      description:
        - "<gray>Enemies need longer to capture your flag."
        - "<gray>+20% capture time per level."
      per-level: 0.20
      costs: [2500, 5000, 10000, 18000, 30000]
    watchtower:
      display-name: "<aqua><bold>Watchtower"
      icon: SPYGLASS
      description:
        - "<gray>Your crew is warned when enemies land."
        - "<gray>Level 2+: intruders glow (longer per level)."
      per-level: 1
      alert-cooldown-seconds: 60
      glow-seconds: 15
      costs: [1500, 4000, 9000]
    harbor:
      display-name: "<dark_aqua><bold>Harbor"
      icon: OAK_BOAT
      description:
        - "<gray>Crewmates swim faster around the island."
        - "<gray>Level 3: also breathe underwater."
      per-level: 1
      costs: [1500, 4000, 8000]
    barracks:
      display-name: "<gold><bold>Barracks"
      icon: RED_BED
      description:
        - "<gray>Crewmates without a bed respawn"
        - "<gray>on this island instead of at spawn."
      per-level: 1
      costs: [5000]
    wellspring:
      display-name: "<green><bold>Wellspring"
      icon: GLOW_BERRIES
      description:
        - "<gray>Crewmates slowly heal while on the island."
        - "<gray>Stronger per level."
      per-level: 1
      costs: [3000, 9000]

raiding:
  # When may enemies build/break/loot on an occupied island?
  #   always   = any non-allied crew
  #   war-only = only crews at WAR with the owners
  #   never    = occupied islands are fully protected (conquest still possible, see conquest.mode)
  mode: war-only
  allow-break: true
  allow-place: true
  allow-containers: true
  # Players without a crew may raid (only with mode: always).
  crewless-can-raid: false
  # A conquest/claim shield also stops raiding.
  respect-shield: true

offline-protection:
  # Islands cannot be raided or conquered while no member of the owning crew is online ...
  enabled: true
  # ... once this many seconds passed since the last member logged out.
  grace-seconds: 300

# -------------------------------------------------------------------------------------
# Conquest: hold the enemy flag to take the island
# -------------------------------------------------------------------------------------
conquest:
  enabled: true
  # always | war-only | never (same meaning as raiding.mode)
  mode: war-only
  # Attackers must stand within this many blocks of the flag (and capture-height vertically).
  capture-radius: 6
  capture-height: 6
  # Seconds of uncontested holding needed.
  capture-seconds: 120
  # Progress lost per second while nobody is capturing.
  decay-per-second: 1.0
  # Attackers of one crew needed inside the radius.
  min-attackers: 1
  # Allies of the owners standing at the flag defend it (pause the capture).
  allies-defend: true
  # Shield after an island changed hands (seconds): no conquest/raiding during it.
  shield-seconds: 3600
  # Owners are alerted at most this often.
  alert-cooldown-seconds: 60
  alert-sound: block.bell.use
  success-sound: ui.toast.challenge_complete
  # Broadcast to the whole server when a capture starts.
  announce-start: false
  reputation:
    # Taken from the losers and given to the conquerors.
    steal: 50
    # Extra reputation for the conquerors.
    bonus: 25
  bossbar:
    color: RED
    contested-color: YELLOW
    # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    overlay: NOTCHED_10

# -------------------------------------------------------------------------------------
# Passive income: Doubloons paid into the crew bank per owned island
# -------------------------------------------------------------------------------------
income:
  enabled: true
  interval-minutes: 30
  # Only pay crews with at least one member online.
  require-online: true
  default: 100
  per-type:
    TROPICAL: 100
    JUNGLE: 120
    VOLCANIC: 200
    SNOWY: 120
    DESERT: 120
    ANCIENT: 180
    CAPITAL: 0

# Optional BlueMap markers (only used when BlueMap is installed).
bluemap:
  enabled: true
  label: Islands
  # Draw the island border as a circle (coloured by owner).
  circles: true
  hidden-by-default: false

