# =====================================================================================
#  AquaticSMP - ISLANDS module
#  The Endless Sea: procedurally generated islands that crews can claim, defend and conquer.
#
#  Quick start for server owners (all admin commands need aquatic.islands.admin, ops have it):
#    1. Stand in the middle of your ocean and run   /island area 3000
#       (sets the ocean area used for random islands and random treasure)
#    2. Build a spawn island where you stand:        /island spawn capital 70 Port Royal
#       then mark it as the safe spawn island:       /island setspawn   (stand on it)
#    3. Scatter islands over the ocean:              /island spawnrandom random 15
#    4. Already built something by hand? Register it: /island register My_Island tropical 50
#  Generation is spread over many ticks (see generation.millis-per-tick) and reports progress.
#
#  Block lists accept "MATERIAL" or "MATERIAL:weight" entries (weight = relative chance).
#  Messages use MiniMessage (https://docs.advntr.dev/minimessage/format.html); <placeholders>
#  are filled in by the plugin.
# =====================================================================================

# How often (seconds) changed data is written to plugins/AquaticSMP/data/islands/ (also saved on shutdown).
# Do not edit: used to upgrade this file when the plugin updates.
config-version: 8

autosave-seconds: 120

# -------------------------------------------------------------------------------------
# Ocean area: where /island spawnrandom puts islands and where the treasure module looks for
# random land when no islands exist. Set it in-game with /island area <radius> [spacing].
# -------------------------------------------------------------------------------------
ocean-area:
  world: world
  center-x: 0
  center-z: 0
  # Islands are placed within this many blocks (square) of the centre. Big islands need a big sea:
  # set it in-game with /island admin area <radius> where you stand.
  radius: 12000
  # Minimum open water between the borders of two islands.
  min-spacing: 200
  # Random spots tried per island before giving up.
  attempts: 80
  # Only use spots that are really ocean (sea floor at least min-water-depth below sea level).
  require-ocean: true
  min-water-depth: 8
  # Free ocean spots are checked in the background ahead of time, so events like the Lost Island can
  # rise instantly without lag. prefetch-radius = the biggest island radius those spots must fit.
  prefetch-spots: 4
  prefetch-radius: 350

# -------------------------------------------------------------------------------------
# Generation
# -------------------------------------------------------------------------------------
generation:
  # Time budget per server tick for terrain work (milliseconds, 1-45). Lower = smoother TPS, slower building.
  millis-per-tick: 20
  # Part of the radius that is dry land; the rest is beach and an underwater slope down to the sea floor.
  land-fraction: 0.72
  # Allowed radius for /island admin spawn and spawnrandom (in blocks from the centre to the edge).
  # Islands are built chunk by chunk without lag (about 40 seconds for radius 400).
  # radius-limit: the biggest island an admin can place by hand (1000 = 2000 blocks across).
  min-radius: 16
  radius-limit: 1000
  # Island sizes for "/island admin spawnrandom <type> <count>" (when no min/max radius is given):
  # a size is picked by weight, then a radius within its range.
  # (radius = centre to edge; the island is twice as wide: radius 50 = 100 blocks across)
  island-sizes:
    small:  {min: 60,  max: 150, weight: 5}   # 120-300 blocks across
    medium: {min: 150, max: 275, weight: 4}   # 300-550 across
    large:  {min: 225, max: 375, weight: 2}   # 450-750 across
    huge:   {min: 450, max: 750, weight: 1}   # 900-1500 across (rare)
  # Bigger islands get taller land: radius 70 uses the heights below, larger islands grow up to
  # max-height-boost times taller. height-scaling 0 = same heights for every size.
  height-scaling: 1.0
  max-height-boost: 3.0
  # Landscape features shared by all island types (per type, "mountains: 0..2" scales the mountains).
  terrain:
    mountains:
      enabled: true
      # Extra height of the highest ridges (full height on islands with radius 250+, smaller islands
      # get smaller mountains). Mountains only rise in some parts of an island, away from the coast.
      height: 45
      # Higher = more, narrower ridges.
      frequency: 1.0
      # Land higher than this above sea level is bare rock; higher than snow-above gets snow caps.
      rock-above: 22
      snow-above: 48
      rock: [STONE:6, ANDESITE:2, COBBLESTONE:1, GRAVEL:1]
    caves:
      enabled: true
      # Only islands at least this big get caves.
      min-island-radius: 40
      # Tunnel width (0.5 = narrow, 1 = normal, 2 = wide).
      size: 1.4
      # How far below sea level caves may reach (they dig into the rock under the island; caves never
      # open into the sea: blocks next to water stay solid).
      depth: 40
      # Some tunnels open up to the surface.
      entrances: true
      # Big open caverns deep down.
      caverns: true
    ore-veins:
      enabled: true
      # Veins per 1000 land blocks, on every island (on top of the scattered ores of each type).
      # Each ore has its own depth: coal/iron/copper near the surface, gold/redstone/lapis lower,
      # diamonds deep below sea level (the caves lead there), emeralds high in the mountains.
      per-1000-land: 10
      ores: [COAL_ORE:6, IRON_ORE:6, COPPER_ORE:4, GOLD_ORE:2.5, REDSTONE_ORE:2, LAPIS_ORE:1.5, DIAMOND_ORE:0.6, EMERALD_ORE:0.3]
  # Maximum islands per /island spawnrandom call.
  max-spawnrandom: 30
  # Chance weights of each type for "/island spawnrandom random ...".
  # How often each type appears with "/island admin spawnrandom random ...". Most islands are the
  # main biomes (plains, forest); special ones like volcanic or ancient islands are rare finds.
  island-type-weights:
    PLAINS: 10
    FOREST: 10
    JUNGLE: 4
    SNOWY: 4
    DESERT: 4
    TROPICAL: 2
    VOLCANIC: 1
    ANCIENT: 1
    TIDEWATCH: 1.5
    VILLAGE: 1.5
    CAPITAL: 0

# What /island delete <island> restore and /island regen turn the area back into.
restore:
  # Sea floor depth below sea level.
  depth: 22
  floor: [GRAVEL:3, SAND:2, CLAY:0.3]
  # Biome painted back (any biome key, or none to leave biomes alone).
  biome: ocean

# -------------------------------------------------------------------------------------
# Island types. Every type has:
#   display-name     MiniMessage name shown to players
#   status           UNCLAIMED or NEUTRAL: status of freshly generated islands of this type
#   biome            biome painted over the island (minecraft key, e.g. jungle, snowy_plains; none = keep)
#   max-height       height of the hills above sea level
#   beach-height     land lower than this (above sea level) becomes beach
#   roughness        hill noise frequency (higher = bumpier)
#   coast-variation  0..0.3, how irregular the coastline is
#   surface / subsurface / core / beach / underwater   block palettes
#   top-layer        optional block laid on top of the surface (e.g. SNOW)
#   frozen-shore     freeze the water around the island
#   ores             blocks + chance per core block
#   trees            density = trees per 100 land blocks; types = org.bukkit.TreeType names
#                    (TREE, BIG_TREE, BIRCH, REDWOOD, TALL_REDWOOD, MEGA_PINE, JUNGLE, SMALL_JUNGLE,
#                    COCOA_TREE, JUNGLE_BUSH, ACACIA, DARK_OAK, CHERRY, AZALEA, ...) or PALM (custom)
#   decorations      block: chance per land column (plants, flowers, cacti ...)
#   ruins            density = ruins per 10,000 land blocks; walls or pillar clusters
#   sea-life         chances per underwater column: coral, seagrass, kelp (defaults: warm islands get
#                    coral reefs, cold ones kelp forests)
#   mountains        0..2, how tall the mountains get on this type
#   town             (CAPITAL) roads, houses, piers and a lighthouse around the plaza
#   shipwreck-chance 0..1, chance of a shipwreck on the beach (default 0.6, capital 0)
#   lakes            freshwater lakes per 10,000 land blocks (default: plains/jungle 2.5, tropical 1.2)
#   volcano          cone with a lava crater
#   plaza            flat central plaza (+ throne)
# -------------------------------------------------------------------------------------
# Rarity of each island type (set per type with "rarity: ..."), shown in /island info.
# Discovering a rarer island pays more: discovery reward x discovery-multiplier.
rarities:
  common: {display: "<gray>Common", discovery-multiplier: 1}
  uncommon: {display: "<green>Uncommon", discovery-multiplier: 1.5}
  rare: {display: "<aqua>Rare", discovery-multiplier: 2.5}
  epic: {display: "<light_purple>Epic", discovery-multiplier: 4}
  legendary: {display: "<gold>Legendary", discovery-multiplier: 6}

