    second: [Isle, Reach, Shelf, Floe, Point, Holm, Spire, Hold, Rest, Fang]
  DESERT:
    fixed: []
    first: [Sunscorch, Dunewalker, Mirage, Amber, Saffron, Dustveil, Bleached, Sandglass, Ochre, Sirocco, Kestrel, Copperdune]
    second: [Waste, Dunes, Mesa, Flats, Isle, Atoll, Expanse, Sands, Crossing, Basin]
  ANCIENT:
    fixed: []
    first: [Elderstone, Forgotten, Sunken, Hollowcrown, Runewatch, Gravemoss, Old, Silent, Lost, Moonlit, Vesper, Ashenveil]
    second: [Ruins, Sanctum, Isle, Reliquary, Archive, Remnant, Throne, Vault, Barrow, Spire]
  CAPITAL:
    fixed: []
    first: [Harbor, Crownport, Highmast, Anchorage, Freeport, Sovereign, Gilded, Tidecrown, Mainsail, Lanternhold]
    second: [City, Port, Bastion, Haven, Citadel, Landing, Harbor, Throne]
  # Generic words used when a type has no words left.
  fallback-first: [Lonely, Windswept, Hidden, Drifting, Nameless, Distant, Sunlit, Stormy]
  fallback-second: [Isle, Key, Rock, Atoll, Cay, Haven, Point, Reef, Cove, Island]

# -------------------------------------------------------------------------------------
# Spawn island (set with /island setspawn; it is made NEUTRAL)
# -------------------------------------------------------------------------------------

# Spawn point, set in-game with /island admin setspawn (exactly where you stand).
spawn:
  # New players start at the spawn point.
  teleport-on-first-join: true
  # Send everyone to spawn on every join (e.g. a lobby-style spawn).
  teleport-on-every-join: false
  # Players without a bed / respawn anchor respawn at the spawn point.
  respawn-here: true
  # /spawn: back to the spawn point (or the capital when no spawn is set). Admins: /spawn <player>.
  # Blocked in combat (see combat.yml). take-over = the name /spawn belongs to AquaticSMP even when
  # another plugin (EssentialsX Spawn) has it too.
  command:
    enabled: true
    warmup-seconds: 3
    cooldown-seconds: 30
    take-over: true
presence:
  # How often (ticks) player positions are checked; players are only re-checked when they changed block.
  check-interval-ticks: 10
  # How entering / leaving an island is shown, every time it happens:
  #   title     = a short title in the middle of the screen (default)
  #   actionbar = a line above the hotbar
  #   both      = title + action bar
  #   chat      = a chat message
  #   none      = nothing
  # (The very first visit of an island always shows the big discovery title, see "discovery".)
  enter-display: title
  leave-display: title
  # The same enter/leave message is not repeated within this many seconds (stops spam when sailing
  # along a coastline that crosses the island border back and forth). 0 = always show.
  repeat-cooldown-seconds: 5
  # Title timing in ticks (20 ticks = 1 second).
  title-fade-in-ticks: 8
  title-stay-ticks: 40
  title-fade-out-ticks: 12

discovery:
  enabled: true
  # Big title on the first visit of an island.
  title: true
  sound: ui.toast.challenge_complete
  sound-volume: 0.8
  sound-pitch: 1.0
  # Doubloons for discovering an island (needs the economy module). Per-type values override.
  reward: 25
  reward-per-type:
    VOLCANIC: 50
    ANCIENT: 50
    CAPITAL: 10

# /island map (alias /island near)
map:
  count: 8
  # Distances are rounded to this many blocks.
  distance-rounding: 10
  # Islands the player has not discovered show as "???" (admins always see names).
  hide-undiscovered-names: true

# -------------------------------------------------------------------------------------
# Claiming (/island claim, needs the crews module; only Captain / First Mate)
# -------------------------------------------------------------------------------------
claiming:
  enabled: true
  # Maximum islands per crew (0 = unlimited).
  max-per-crew: 3
  # Minimum crew size to claim.
  min-members: 1
  # Price: cost + cost-per-owned-island * islands already owned.
  cost: 1000
  cost-per-owned-island: 500
  # bank = paid from the crew bank, player = paid by the claiming officer (needs the economy module).
  pay-from: bank
  # Reputation the crew gains for claiming.
  reputation: 10
  # Optional protection from conquest right after claiming (seconds, 0 = none).
  shield-seconds: 600
  # Server-wide announcement (otherwise only the crew is told).
  announce: true
  # Types that cannot be claimed at all.
  unclaimable-types: [CAPITAL]

flag:
  # The flag pole: this many blocks of pole-material with the crew banner on top.
  pole-height: 3
  pole-material: OAK_FENCE
  # Banner used when the crew has no flag.
  default-banner: WHITE_BANNER

# -------------------------------------------------------------------------------------
# Protection
# -------------------------------------------------------------------------------------
protection:
  # May anyone build on unclaimed islands?
  unclaimed-build: true
  unclaimed-explosions: true
  # Allies of the owning crew may build on its islands.
  allies-can-build: true
  occupied:
    # Containers (chests, barrels, furnaces, ...) count as protected for non-members.
    protect-containers: true
    # Explosions on occupied islands: raid = only while the island can be raided, always, never.
    explosions: raid
    fire-spread: false
    # Endermen etc. may change blocks on occupied islands.
    mob-griefing: true
  neutral:
    pvp: false
    # Use doors, buttons, levers... on neutral islands.
    allow-interact: true
    # Open chests (e.g. shops) on neutral islands.
    allow-containers: false

# Anyone may dig straight down to a buried treasure chest and open it, even on claimed or neutral
# islands (only the blocks right above the chest, nothing around it). false = island protection applies.
treasure-digging: true

# -------------------------------------------------------------------------------------
# Island development: upgrades a crew buys from its crew bank (/island manage or /island upgrade).
# Only Captain and First Mate can buy. costs = price of level 1, 2, 3, ... (the list length is the max level).
# per-level = effect strength per level.
# -------------------------------------------------------------------------------------
upgrades:
  enabled: true
  # When an island is conquered: keep | lose-one (every upgrade drops a level) | reset
  on-conquest: lose-one
  types:
    treasury:
      display-name: "<gold><bold>Treasury"
      icon: GOLD_BLOCK
      description:
        - "<gray>More passive income from this island."
        - "<gray>+25% income per level."
      per-level: 0.25
      costs: [2000, 4000, 8000, 15000, 25000]
    fortress:
      display-name: "<red><bold>Fortress"
      icon: IRON_BARS
      description:
        - "<gray>Enemies need longer to capture your flag."
        - "<gray>+20% capture time per level."
      per-level: 0.20
      costs: [2500, 5000, 10000, 18000, 30000]
    watchtower:
      display-name: "<aqua><bold>Watchtower"
      icon: SPYGLASS
      description:
        - "<gray>Your crew is warned when enemies land."
        - "<gray>Level 2+: intruders glow (longer per level)."
      per-level: 1
      alert-cooldown-seconds: 60
      glow-seconds: 15
      costs: [1500, 4000, 9000]
    harbor:
      display-name: "<dark_aqua><bold>Harbor"
      icon: OAK_BOAT
      description:
        - "<gray>Crewmates swim faster around the island."
        - "<gray>Level 3: also breathe underwater."
      per-level: 1
      costs: [1500, 4000, 8000]
    barracks:
      display-name: "<gold><bold>Barracks"
      icon: RED_BED
      description:
        - "<gray>Crewmates without a bed respawn"
        - "<gray>on this island instead of at spawn."
      per-level: 1
      costs: [5000]
    wellspring:
      display-name: "<green><bold>Wellspring"
      icon: GLOW_BERRIES
      description:
        - "<gray>Crewmates slowly heal while on the island."
        - "<gray>Stronger per level."
      per-level: 1
      costs: [3000, 9000]
    vault:
      display-name: "<light_purple><bold>Vault"
      icon: ENDER_CHEST
      description:
        - "<gray>Storage for the whole crew on this island"
        - "<gray>(/island vault). 9, 27 or 54 slots."
        - "<red>Conquerors take what's inside!"
      per-level: 1
      # Slots per level.
      sizes: [9, 27, 54]
      # Only open it while standing on the island.
      on-island-only: true
      costs: [3000, 8000, 16000]
    granary:
      display-name: "<yellow><bold>Granary"
      icon: HAY_BLOCK
      description:
        - "<gray>Crewmates slowly get their hunger"
        - "<gray>back while on the island."
      per-level: 1
      costs: [2000, 6000]

# -------------------------------------------------------------------------------------
# Facilities: buildings a crew buys from the crew bank and places on its island (Captain and officers).
# /island manage -> Facilities, or /island facility. Picking one shows a preview first: the building
# appears in front of you (only you see it), blocks of yours in the way show as red glass, and chat says
# what is wrong. Then [Build], [Rotate], [Move here] or [Cancel]. Stand inside one and use
# /island facility remove to demolish it (refund of part of the price; chest contents drop).
# income-bonus: extra island income (0.05 = +5%), on top of the Treasury upgrade.
# -------------------------------------------------------------------------------------
facilities:
  enabled: true
  # Facilities on one island (all kinds together).
  max-per-island: 8
  # Part of the price paid back to the crew bank when one is demolished.
  refund: 0.5
  # How long a preview stays up.
  preview-seconds: 120
  # Construction: the site is cleared, then the building goes up from the ground, block by block.
  # build-seconds is how long that takes (a type can set its own "build-seconds").
  build-seconds: 30
  # Blocks fly into place (display entities, seen by everyone). false = they just appear one by one.
  animate: true
  # Your own facilities: add a type with a "schematic" (a file in plugins/AquaticSMP/schematics). Example:
  #   tavern:
  #     display-name: "<gold><bold>Tavern"
  #     icon: BREWING_STAND
  #     description: ["<gray>Drinks for the whole crew."]
  #     schematic: "tavern.schem"   # .schem (WorldEdit/FAWE) or .nbt (structure block)
  #     front: north                 # the side with the entrance, as the build was saved
  #     y-offset: 0                  # 0 = its bottom layer replaces the ground; -1 = one deeper
  #     foundation: STONE_BRICKS     # optional: fill gaps under it down to the ground
  #     needs-water: false           # true = like the dock, it has to reach out over the water
  #     cost: 5000
  #     limit: 1
  #     income-bonus: 0.05
  # A built-in facility can use a schematic too: give it "schematic" and your build replaces ours.
  types:
    watchtower:
      display-name: "<aqua><bold>Watchtower"
      icon: SPYGLASS
      description:
        - "<gray>A tall lookout with a ladder and a roofed"
        - "<gray>platform: see ships coming from far away."
      cost: 3000
      limit: 2
      income-bonus: 0
    forge:
      display-name: "<gold><bold>Forge"
      icon: ANVIL
      description:
        - "<gray>An open smithy: anvil, smithing table,"
        - "<gray>blast furnace, grindstone and a chest."
      cost: 2500
      limit: 1
      income-bonus: 0.05
    farm:
      display-name: "<green><bold>Farm Field"
      icon: WHEAT
      description:
        - "<gray>A fenced 9x9 field with water, already"
        - "<gray>planted with wheat, carrots, potatoes and beets."
      cost: 1500
      limit: 3
      income-bonus: 0.05
    dock:
      display-name: "<dark_aqua><bold>Dock"
      icon: OAK_BOAT
      description:
        - "<gray>A wooden dock out over the water on posts."
        - "<gray>Stand at the shore and face the sea."
      cost: 2000
      limit: 2
      income-bonus: 0.10
    storehouse:
      display-name: "<#c8a165><bold>Storehouse"
      icon: BARREL
      description:
        - "<gray>A timber storehouse full of barrels,"
        - "<gray>with a crafting table and a gabled roof."
      cost: 2000
      limit: 2
      income-bonus: 0.05
    lighthouse:
      display-name: "<red><bold>Lighthouse"
      icon: SEA_LANTERN
      description:
        - "<gray>A red and white lighthouse with a glowing"
        - "<gray>lantern room. Climb the ladder to the top."
      cost: 4000
      limit: 1
      income-bonus: 0.05
      build-seconds: 45

# -------------------------------------------------------------------------------------
# Schematics: builds from files in plugins/AquaticSMP/schematics (.schem from WorldEdit/FAWE, or .nbt from
# a structure block). Save a build with its entrance on the NORTH side; its bottom layer replaces the ground.
# Only blocks are copied (not chest contents or sign text yet). Structure void is skipped, air clears.
#   /island admin schematic list                      the files
#   /island admin schematic preview <file> [front]    a ghost of it in front of you (only you see it)
#   /island admin schematic rotate | move | cancel
#   /island admin schematic paste [instant]           build it (rising with the animation, or at once)
#   /island admin schematic undo                      put back what your last paste replaced
# -------------------------------------------------------------------------------------
schematics:
  # Bigger files are refused (previews of huge builds are heavy for the player's client).
  max-blocks: 250000
  # How long an animated paste takes.
  paste-seconds: 40
  # Builds with more blocks than this rise layer by layer without flying blocks.
  animate-max-blocks: 6000
  # Default height for admin pastes (0 = the bottom layer replaces the ground).
  y-offset: 0

# Builds placed automatically on every new island of a type when it is generated (and on an existing
# island with /island admin builds <island>). offset: [x, z] or [x, y, z] from the island centre
# (y = up/down from the ground there). facing: where the entrance points (north/east/south/west).
# front: the entrance side as the build was saved. foundation: optional block to fill gaps under it.
# Example, for the spawn town on the capital:
#   CAPITAL:
#     - {schematic: "town_hall.schem", offset: [0, 30], facing: north}
#     - {schematic: "fountain.nbt", offset: [0, -18]}
builds:
  CAPITAL: []
  VILLAGE: []

# -------------------------------------------------------------------------------------
# Tidewatch outposts (island type TIDEWATCH): a garrison defends the fort while players are on the
# island. Kill the Warden Captain in the keep to liberate the island: every attacker on the island
# gets captain-reward Doubloons and captain-xp, the fort's strongbox appears as a buried treasure, and
# for liberated-hours a crew can claim the island. Unclaimed forts get a new garrison after that.
# -------------------------------------------------------------------------------------
tidewatch:
  enabled: true
  base-soldiers: 4
  # Extra soldiers per extra player on the island, up to max-soldiers.
  per-player: 2
  max-soldiers: 12
  # Seconds between reinforcement waves.
  reinforce-seconds: 25
  liberated-hours: 12
  soldier-reward: 35
  captain-reward: 1500
  captain-xp: 400
  strongbox-tier: rare
  # Which soldiers spawn (template:weight).
  soldiers: ["recruit:5", "rifleman:3", "lieutenant:1"]
  # Officers (templates with "powers") use an Abyss Fruit power on their target every power-cooldown-seconds,
  # after a one-second warning (particles and a sound) so players can dodge. Captains hit 40% harder.
  # Powers: ember (fireballs), frost (freezing nova), thunder (lightning at the target), gale (gust).
  power-cooldown-seconds: 9
  power-damage: 6
  # Chance that an officer has a fruit power at all (0.2 = one in five). A template can set its own
  # "power-chance" too.
  power-chance: 0.2
  power-names:
    ember: "<gold>(Emberheart)"
    frost: "<aqua>(Rimefrost)"
    thunder: "<yellow>(Thunderveil)"
    gale: "<white>(Galeborn)"
  # Equipment can be a MATERIAL or "item:<custom item>" (the Tidewatch uniforms from items.yml, which get
  # their own look with the resource pack). If the items module is off, these materials are used instead.
  uniform-fallback:
    tidewatch_hat: LEATHER_HELMET
    tidewatch_coat: LEATHER_CHESTPLATE
    tidewatch_trousers: LEATHER_LEGGINGS
    tidewatch_boots: LEATHER_BOOTS
    tidewatch_officer_coat: CHAINMAIL_CHESTPLATE
    tidewatch_captain_hat: GOLDEN_HELMET
    tidewatch_captain_coat: GOLDEN_CHESTPLATE
  mobs:
    recruit:
      type: ZOMBIE
      name: "<blue>Tidewatch Recruit"
      health-multiplier: 1.5
      damage-multiplier: 1.2
      equipment: {helmet: "item:tidewatch_hat", chestplate: "item:tidewatch_coat", leggings: "item:tidewatch_trousers",
                  boots: "item:tidewatch_boots", mainhand: IRON_SWORD}
    # Riflemen and officers are illagers (pillagers and vindicators): they move and fight like soldiers and
    # the resource pack dresses them in Tidewatch uniform (in an ocean world no others spawn on their own).
    rifleman:
      type: PILLAGER
      name: "<blue>Tidewatch Rifleman"
      health-multiplier: 1.6
      # helmet: a random look per soldier ("look:<id>" = a 3D hat and face from the resource pack).
      equipment:
        mainhand: CROSSBOW
        helmet: ["look:tw_shako", "look:tw_shako", "look:tw_shako_mustache_brown", "look:tw_shako_mustache_black",
                 "look:tw_shako_mustache_ginger", "look:tw_shako_beard_brown", "look:tw_shako_eyepatch"]
    lieutenant:
      type: VINDICATOR
      name: "<dark_blue>Tidewatch Lieutenant"
      health-multiplier: 2.2
      damage-multiplier: 1.3
      powers: [frost, gale]
      equipment:
        helmet: ["look:tw_tricorn", "look:tw_tricorn_mustache_grey", "look:tw_tricorn_beard_black",
                 "look:tw_tricorn_beard_ginger", "look:tw_tricorn_eyepatch"]
        chestplate: "item:tidewatch_officer_coat"
        leggings: "item:tidewatch_trousers"
        boots: "item:tidewatch_boots"
        mainhand: IRON_AXE
    captain:
      type: VINDICATOR
      name: "<dark_aqua><bold>Warden Captain</bold>"
      health: 180
      damage-multiplier: 1.5
      effects: ["resistance:1"]
      powers: [ember, frost, thunder, gale]
      equipment:
        helmet: ["look:tw_bicorne_mustache_white", "look:tw_bicorne_beard_grey", "look:tw_bicorne_eyepatch"]
        chestplate: "item:tidewatch_captain_coat"
        leggings: "item:tidewatch_trousers"
        boots: "item:tidewatch_boots"
        mainhand: DIAMOND_AXE

raiding:
  # When may enemies build/break/loot on an occupied island?
  #   always   = any non-allied crew
  #   war-only = only crews at WAR with the owners
  #   never    = occupied islands are fully protected (conquest still possible, see conquest.mode)
  mode: war-only
  allow-break: true
  allow-place: true
  allow-containers: true
  # Players without a crew may raid (only with mode: always).
  crewless-can-raid: false
  # A conquest/claim shield also stops raiding.
  respect-shield: true

offline-protection:
  # Islands cannot be raided or conquered while no member of the owning crew is online ...
  enabled: true
  # ... once this many seconds passed since the last member logged out.
  grace-seconds: 300

# -------------------------------------------------------------------------------------
# Conquest: hold the enemy flag to take the island
# -------------------------------------------------------------------------------------
conquest:
  enabled: true
  # always | war-only | never (same meaning as raiding.mode)
  mode: war-only
  # Attackers must stand within this many blocks of the flag (and capture-height vertically).
  capture-radius: 6
  capture-height: 6
  # Seconds of uncontested holding needed.
  capture-seconds: 120
  # Progress lost per second while nobody is capturing.
  decay-per-second: 1.0
  # Attackers of one crew needed inside the radius.
  min-attackers: 1
  # Allies of the owners standing at the flag defend it (pause the capture).
  allies-defend: true
  # Shield after an island changed hands (seconds): no conquest/raiding during it.
  shield-seconds: 3600
  # Owners are alerted at most this often.
  alert-cooldown-seconds: 60
  alert-sound: block.bell.use
  success-sound: ui.toast.challenge_complete
  # Broadcast to the whole server when a capture starts.
  announce-start: false
  reputation:
    # Taken from the losers and given to the conquerors.
    steal: 50
    # Extra reputation for the conquerors.
    bonus: 25
  bossbar:
    color: RED
    contested-color: YELLOW
    # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    overlay: NOTCHED_10

# -------------------------------------------------------------------------------------
# Passive income: Doubloons paid into the crew bank per owned island
# -------------------------------------------------------------------------------------
income:
  enabled: true
  interval-minutes: 30
  # Only pay crews with at least one member online.
  require-online: true
  default: 100
  per-type:
    TROPICAL: 100
    JUNGLE: 120
    VOLCANIC: 200
    SNOWY: 120
    DESERT: 120
    ANCIENT: 180
    CAPITAL: 0

# Optional BlueMap markers (only used when BlueMap is installed).
bluemap:
  enabled: true
  label: Islands
  # Draw the island border as a circle (coloured by owner).
  circles: true
  hidden-by-default: false

